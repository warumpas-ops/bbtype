<!DOCTYPE html>

<head>

<style>

/* â”€â”€ Themes â”€â”€ */

/* â”€â”€ Full Height App Container (fills 720x720 screen) â”€â”€ */
#app-container {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  height: 100%;
  width: 100%;
  padding: 8px 12px 6px;
  position: relative;
}

/* â”€â”€ Header: Single non-wrapping compact line â”€â”€ */
#header {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;

  flex-shrink: 0;
}

#logo {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
}
#logo span { font-size: 12px; font-weight: normal; }

#header-menu {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
}

.pill-btn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 12px;
  padding: 3px 6px;
  margin-left: 2px;
  cursor: pointer;
  border-radius: 3px;
  outline: none;
}

  font-weight: bold;
}

/* â”€â”€ Live Stats Row â”€â”€ */
#stats-row {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: baseline;
  -webkit-align-items: baseline;

  flex-shrink: 0;
}

#timer-val {
  font-size: 30px;
  font-weight: bold;
  line-height: 1;
}

#live-indicators {
  font-size: 14px;
  text-align: right;
}
#live-wpm-val { font-weight: bold; margin-right: 8px; }

/* â”€â”€ Words Display Area (Fills remaining height) â”€â”€ */
#words-wrapper {
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  position: relative;
  overflow: hidden;
  margin: 6px 0;
  cursor: text;
  min-height: 160px;
}

#words-inner {
  position: relative;
  -webkit-transition: margin-top 0.1s ease-out;
  transition: margin-top 0.1s ease-out;
  padding-top: 2px;
}

.word {
  display: inline-block;
  margin: 0 10px 10px 0;
  font-size: 21px;
  line-height: 30px;
  vertical-align: top;
  white-space: nowrap;
}

.char {
  position: relative;
}

/* â”€â”€ Instant Hardware-Accelerated Carets (0 forced reflows) â”€â”€ */
.caret-bar .current-char {
  border-left: 2px solid #e2b714;
  margin-left: -1px;
  padding-left: 1px;
  -webkit-animation: blinkBar 0.9s infinite;
  animation: blinkBar 0.9s infinite;
}

.caret-block .current-char {
  background-color: rgba(226, 183, 20, 0.35);
  border-radius: 2px;
  -webkit-animation: blinkBlock 0.9s infinite;
  animation: blinkBlock 0.9s infinite;
}

.caret-underline .current-char {
  border-bottom: 2px solid #e2b714;
  -webkit-animation: blinkBar 0.9s infinite;
  animation: blinkBar 0.9s infinite;
}

/* Matrix caret colors */
body.theme-matrix .caret-bar .current-char { border-color: #00ff66; }
body.theme-matrix .caret-block .current-char { background-color: rgba(0, 255, 102, 0.35); }
body.theme-matrix .caret-underline .current-char { border-color: #00ff66; }

/* Dracula caret colors */
body.theme-dracula .caret-bar .current-char { border-color: #bd93f9; }
body.theme-dracula .caret-block .current-char { background-color: rgba(189, 147, 249, 0.35); }
body.theme-dracula .caret-underline .current-char { border-color: #bd93f9; }

/* Paper caret colors */
body.theme-paper .caret-bar .current-char { border-color: #c62828; }
body.theme-paper .caret-block .current-char { background-color: rgba(198, 40, 40, 0.35); }
body.theme-paper .caret-underline .current-char { border-color: #c62828; }

@-webkit-keyframes blinkBar { 0%, 100% { border-color: inherit; } 50% { border-color: transparent; } }
@keyframes blinkBar { 0%, 100% { border-color: inherit; } 50% { border-color: transparent; } }

@-webkit-keyframes blinkBlock { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes blinkBlock { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* â”€â”€ Hidden Input â”€â”€ */
#hidden-input {
  position: absolute;
  left: -9999px;
  top: 0;
  opacity: 0;
  width: 1px;
  height: 1px;
  border: none;
  outline: none;
}

/* â”€â”€ Bottom Bar â”€â”€ */
#bottom-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  height: 24px;
  flex-shrink: 0;
  border-top: 1px solid #3d3f42;
  padding-top: 2px;
}

.bot-btn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  outline: none;
  padding: 2px 4px;
}
.bot-hint {
  font-size: 11px;
}

/* â”€â”€ Focus Prompt â”€â”€ */
#focus-prompt {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(30, 32, 35, 0.9);
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  font-size: 14px;
  cursor: pointer;
  z-index: 10;
}

/* â”€â”€ Results View â”€â”€ */
#results-view {
  display: none;
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  text-align: center;
}

#res-wpm-large {
  font-size: 56px;
  font-weight: bold;
  line-height: 1;
}
#res-wpm-label {
  font-size: 13px;
  margin-bottom: 8px;
}
#res-stats-box {
  border-radius: 6px;
  padding: 8px 16px;
  font-size: 13px;
  margin-bottom: 14px;
  width: 90%;

}

#try-again-btn {
  border: none;
  font-family: inherit;
  font-size: 15px;
  font-weight: bold;
  padding: 8px 24px;
  border-radius: 6px;
  cursor: pointer;
  outline: none;
}

/* â”€â”€ Settings Drawer Modal â”€â”€ */
#settings-modal {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(22, 24, 27, 0.96);
  z-index: 50;
  padding: 10px;
  overflow-y: auto;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
}

#settings-top {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding-bottom: 6px;
  border-bottom: 1px solid #444;
  margin-bottom: 6px;
}

.set-row {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #2f2f2f;
  font-size: 12px;
}

.set-group {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
}

.set-btn {
  background: #333;

  border: none;
  font-family: inherit;
  font-size: 11px;
  padding: 4px 7px;

  background: #e2b714;

body.theme-paper .set-btn.active { background: #c62828; color: #ffffff; }
</style>

<body class="theme-monkeytype">

<div id="app-container" class="caret-bar">
  <!-- Header -->
  <div id="header">
    <div id="logo" class="c-main">bb<span class="c-sub">type</span></div>
    <div id="header-menu">
      <button class="pill-btn c-sub active" data-type="time" data-val="15">15</button>
      <button class="pill-btn c-sub" data-type="time" data-val="30">30</button>
      <button class="pill-btn c-sub" data-type="time" data-val="60">60</button>
      <button class="pill-btn c-sub" data-type="words" data-val="25">words</button>
      <button class="pill-btn c-sub" id="btn-settings">âš™</button>
    </div>
  </div>

  <!-- Live Stats -->
  <div id="stats-row">
    <div id="timer-val" class="c-main">15</div>
    <div id="live-indicators">
      <span id="live-wpm-val" class="c-main">0 wpm</span>
      <span id="live-acc-val" class="c-sub">100%</span>
    </div>
  </div>

  <!-- Words Area (Takes all vertical space) -->
  <div id="words-wrapper">
    <div id="words-inner"></div>
    <div id="focus-prompt" class="c-main">Tap or press any key to focus</div>
  </div>

  <!-- Results Screen -->
  <div id="results-view">
    <div id="res-wpm-large" class="c-main">0</div>
    <div id="res-wpm-label" class="c-sub">words per minute</div>
    <div id="res-stats-box" class="bg-panel c-sub">
      acc: <span id="res-acc" class="c-text">100%</span> &nbsp;|&nbsp;
      raw: <span id="res-raw" class="c-text">0</span> &nbsp;|&nbsp;
      chars: <span id="res-chars" class="c-text">0/0</span>
    </div>
    <button id="try-again-btn" class="bg-accent">â†» Next Test (Enter / Tab)</button>
  </div>

  <!-- Hidden Input -->
  <input type="text" id="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

  <!-- Bottom Bar -->
  <div id="bottom-bar">
    <button class="bot-btn c-sub" id="btn-restart">â†» restart</button>
    <div class="bot-hint c-sub">tab to restart</div>
    <div class="bot-hint c-sub" id="pb-tag">PB: 0</div>
  </div>

  <!-- Settings Modal -->
  <div id="settings-modal">
    <div id="settings-top">
      <b class="c-main">Settings</b>
      <button class="pill-btn c-sub" id="btn-close-settings">âœ– Close (Esc)</button>
    </div>

    <!-- Theme -->
    <div class="set-row">
      <span class="c-text">Theme</span>
      <div class="set-group" id="grp-theme">
        <button class="set-btn active" data-val="monkeytype">monkey</button>
        <button class="set-btn" data-val="matrix">matrix</button>
        <button class="set-btn" data-val="dracula">dracula</button>
        <button class="set-btn" data-val="carbon">carbon</button>
        <button class="set-btn" data-val="paper">paper</button>
      </div>
    </div>

    <!-- Difficulty -->
    <div class="set-row">
      <span class="c-text">Difficulty</span>
      <div class="set-group" id="grp-diff">
        <button class="set-btn active" data-val="normal">normal</button>
        <button class="set-btn" data-val="expert">expert</button>
        <button class="set-btn" data-val="master">master</button>
      </div>
    </div>

    <!-- Confidence -->
    <div class="set-row">
      <span class="c-text">Confidence</span>
      <div class="set-group" id="grp-conf">
        <button class="set-btn active" data-val="off">off</button>
        <button class="set-btn" data-val="on">on</button>
        <button class="set-btn" data-val="max">max</button>
      </div>
    </div>

    <!-- Stop on error -->
    <div class="set-row">
      <span class="c-text">Stop Error</span>
      <div class="set-group" id="grp-stop">
        <button class="set-btn active" data-val="off">off</button>
        <button class="set-btn" data-val="letter">letter</button>
        <button class="set-btn" data-val="word">word</button>
      </div>
    </div>

    <!-- Caret Style -->
    <div class="set-row">
      <span class="c-text">Caret</span>
      <div class="set-group" id="grp-caret">
        <button class="set-btn active" data-val="bar">bar</button>
        <button class="set-btn" data-val="block">block</button>
        <button class="set-btn" data-val="underline">underline</button>
      </div>
    </div>

    <!-- Punctuation / Numbers -->
    <div class="set-row">
      <span class="c-text">Modes</span>
      <div class="set-group">
        <button class="set-btn" id="set-punct">@ punct</button>
        <button class="set-btn" id="set-num"># num</button>
      </div>
    </div>
  </div>
</div>

<script>
(function() {
  /* â”€â”€ Word Bank (250 Top English Words) â”€â”€ */
  var WORDS = [
    'the','be','of','and','a','to','in','he','have','it','that','for',
    'they','with','as','not','on','she','at','by','this','we','you','do',
    'but','from','or','which','one','would','all','will','there','say',
    'who','make','when','can','more','if','no','man','out','other','so',
    'what','time','up','go','about','than','into','could','only','new',
    'year','some','take','come','these','know','see','use','get','like',
    'then','first','any','work','now','may','such','give','over','think',
    'most','even','find','day','also','after','way','many','must','look',
    'before','great','back','through','long','where','much','should',
    'well','people','down','own','just','because','good','each','those',
    'feel','seem','how','high','too','place','little','world','very',
    'still','hand','old','life','tell','write','here','show','house',
    'both','between','need','mean','call','under','last','right','move',
    'thing','school','never','same','begin','while','number','part',
    'turn','real','leave','might','want','point','form','off','child',
    'few','small','since','ask','late','home','large','end','open',
    'follow','again','hold','around','head','word','keep','face','group',
    'play','stand','early','course','change','help','line','city','put',
    'close','case','force','meet','once','water','upon','war','build',
    'hear','light','live','every','country','bring','let','side','try',
    'name','run','read','door','set','order','eye','plan','air','story',
    'power','grow','best','night','start','stop','add','love','far',
    'idea','often','above','learn','team','does','room','land','body',
    'car','earth','food','sure','watch','next','left','always','book'
  ];

  /* â”€â”€ Configuration â”€â”€ */
  var cfg = {
    mode: 'time',     // 'time' | 'words'
    timeVal: 15,      // 15, 30, 60
    wordsVal: 25,     // 25, 50, 100
    withPunct: false,
    withNum: false,
    theme: 'monkeytype',
    diff: 'normal',   // 'normal' | 'expert' | 'master'
    conf: 'off',      // 'off' | 'on' | 'max'
    stop: 'off',      // 'off' | 'letter' | 'word'
    caret: 'bar'      // 'bar' | 'block' | 'underline'
  };

  /* â”€â”€ Runtime State â”€â”€ */
  var activeWords = [];
  var wordIndex = 0;
  var wordHistory = []; // past typed strings
  var isRunning = false;
  var isFinished = false;
  var timerId = null;
  var startTime = 0;
  var timeLeft = 15;
  var wordsLeft = 25;

  var correctChars = 0;
  var incorrectChars = 0;
  var rawChars = 0;

  /* â”€â”€ DOM References â”€â”€ */
  var container = document.getElementById('app-container');
  var timerVal = document.getElementById('timer-val');
  var liveWpmVal = document.getElementById('live-wpm-val');
  var liveAccVal = document.getElementById('live-acc-val');
  var wordsWrapper = document.getElementById('words-wrapper');
  var wordsInner = document.getElementById('words-inner');
  var hiddenInput = document.getElementById('hidden-input');
  var focusPrompt = document.getElementById('focus-prompt');
  var resultsView = document.getElementById('results-view');
  var resWpmLarge = document.getElementById('res-wpm-large');
  var resAcc = document.getElementById('res-acc');
  var resRaw = document.getElementById('res-raw');
  var resChars = document.getElementById('res-chars');
  var tryAgainBtn = document.getElementById('try-again-btn');
  var btnRestart = document.getElementById('btn-restart');
  var pbTag = document.getElementById('pb-tag');
  var settingsModal = document.getElementById('settings-modal');
  var btnSettings = document.getElementById('btn-settings');
  var btnCloseSettings = document.getElementById('btn-close-settings');
  var setPunct = document.getElementById('set-punct');
  var setNum = document.getElementById('set-num');

  /* â”€â”€ Persistence â”€â”€ */
  function loadSettings() {
    try {
      var saved = localStorage.getItem('bbtype_v2_cfg');
      if (saved) {
        var parsed = JSON.parse(saved);
        for (var k in parsed) { cfg[k] = parsed[k]; }
      }
    } catch(e) {}
    applySettingsUI();
  }

  function saveSettings() {
    try {
      localStorage.setItem('bbtype_v2_cfg', JSON.stringify(cfg));
    } catch(e) {}
  }

  function applySettingsUI() {
    document.body.className = 'theme-' + cfg.theme;
    container.className = 'caret-' + cfg.caret;

    // Header pills
    var headerBtns = document.getElementById('header-menu').getElementsByTagName('button');
    for (var i = 0; i < headerBtns.length; i++) {
      var btn = headerBtns[i];
      var t = btn.getAttribute('data-type');
      var v = parseInt(btn.getAttribute('data-val'), 10);
      if (t === cfg.mode && ((t === 'time' && v === cfg.timeVal) || (t === 'words' && v === cfg.wordsVal))) {
        btn.className = 'pill-btn c-main active';
      } else if (btn.id !== 'btn-settings') {
        btn.className = 'pill-btn c-sub';
      }
    }

    // Settings group buttons
    syncGroupActive('grp-theme', cfg.theme);
    syncGroupActive('grp-diff', cfg.diff);
    syncGroupActive('grp-conf', cfg.conf);
    syncGroupActive('grp-stop', cfg.stop);
    syncGroupActive('grp-caret', cfg.caret);

    setPunct.className = 'set-btn' + (cfg.withPunct ? ' active' : '');
    setNum.className = 'set-btn' + (cfg.withNum ? ' active' : '');

    loadPB();
  }

  function syncGroupActive(id, val) {
    var g = document.getElementById(id);
    if (!g) return;
    var btns = g.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (btns[i].getAttribute('data-val') === val) ? 'set-btn active' : 'set-btn';
    }
  }

  function getPBKey() {
    return 'bbtype_pb_' + cfg.mode + '_' + (cfg.mode === 'time' ? cfg.timeVal : cfg.wordsVal);
  }

  function loadPB() {
    try {
      var val = localStorage.getItem(getPBKey()) || '0';
      pbTag.textContent = 'PB: ' + val;
    } catch(e) { pbTag.textContent = 'PB: 0'; }
  }

  function savePB(wpm) {
    try {
      var key = getPBKey();
      var cur = parseInt(localStorage.getItem(key) || '0', 10);
      if (wpm > cur) {
        localStorage.setItem(key, wpm);
        pbTag.textContent = 'PB: ' + wpm;
      }
    } catch(e) {}
  }

  /* â”€â”€ Words Generation â”€â”€ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function generateWords(count) {
    var pool = shuffle(WORDS);
    var list = [];
    var puncs = ['.', ',', '!', '?', ';', '-'];

    for (var i = 0; i < count; i++) {
      var w = pool[i % pool.length];
      if (cfg.withNum && Math.random() < 0.15) {
        w = String(Math.floor(Math.random() * 900 + 10));
      } else if (cfg.withPunct) {
        var r = Math.random();
        if (r < 0.15) w = w.charAt(0).toUpperCase() + w.slice(1);
        if (r < 0.22) w = w + puncs[Math.floor(Math.random() * puncs.length)];
      }
      list.push(w);
    }
    return list;
  }

  /* â”€â”€ DOM Rendering â”€â”€ */
  function renderWordsDOM() {
    var html = '';
    for (var i = 0; i < activeWords.length; i++) {
      var w = activeWords[i];
      html += '<div class="word" id="w-' + i + '">';
      for (var j = 0; j < w.length; j++) {
        var cls = 'char c-sub';
        if (i === 0 && j === 0) cls += ' current-char';
        html += '<span class="' + cls + '">' + escapeHtml(w.charAt(j)) + '</span>';
      }
      html += '</div>';
    }
    wordsInner.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* â”€â”€ Ultra-Fast Zero-Lag Input Handler â”€â”€ */
  function updateWordDisplay() {
    var wordEl = document.getElementById('w-' + wordIndex);
    if (!wordEl) return;

    var val = hiddenInput.value;
    var targetWord = activeWords[wordIndex];
    var spans = wordEl.children;

    for (var i = 0; i < targetWord.length; i++) {
      var span = spans[i];
      if (!span) continue;

      if (i < val.length) {
        var isMatch = (val.charAt(i) === targetWord.charAt(i));
        span.className = 'char ' + (isMatch ? 'c-text' : 'c-err');
      } else if (i === val.length) {
        span.className = 'char c-sub current-char';
      } else {
        span.className = 'char c-sub';
      }
    }

    // Extra characters typed past word length
    var existingExtras = wordEl.getElementsByClassName('extra-char');
    while (existingExtras.length > 0) {
      existingExtras[0].parentNode.removeChild(existingExtras[0]);
    }

    if (val.length > targetWord.length) {
      for (var k = targetWord.length; k < val.length; k++) {
        var extra = document.createElement('span');
        extra.className = 'char c-err extra-char';
        if (k === val.length - 1) extra.className += ' current-char';
        extra.textContent = val.charAt(k);
        wordEl.appendChild(extra);
      }
    }

    // Master mode sudden death check
    if (cfg.diff === 'master') {
      for (var m = 0; m < val.length; m++) {
        if (m < targetWord.length && val.charAt(m) !== targetWord.charAt(m)) {
          failTest('Master: 100% Accuracy Required');
          return;
        }
      }
    }

    // Stop on error (letter) check
    if (cfg.stop === 'letter' && val.length > 0) {
      var lastIdx = val.length - 1;
      if (lastIdx < targetWord.length && val.charAt(lastIdx) !== targetWord.charAt(lastIdx)) {
        hiddenInput.value = val.substring(0, lastIdx);
        updateWordDisplay();
        return;
      }
    }
  }

  function handleSpace() {
    var val = hiddenInput.value;
    if (val.length === 0) return;

    var targetWord = activeWords[wordIndex];
    var isExact = (val === targetWord);

    // Stop on error (word)
    if (cfg.stop === 'word' && !isExact) return;

    // Expert sudden death check
    if (cfg.diff === 'expert' && !isExact) {
      failTest('Expert: Word Misspelled');
      return;
    }

    // Calculate characters
    var maxLen = Math.max(val.length, targetWord.length);
    for (var i = 0; i < maxLen; i++) {
      if (i < val.length && i < targetWord.length) {
        if (val.charAt(i) === targetWord.charAt(i)) correctChars++;
        else incorrectChars++;
      } else {
        incorrectChars++;
      }
      rawChars++;
    }
    if (isExact) correctChars++;
    else incorrectChars++;
    rawChars++;

    // Clear cursor from finished word
    var oldWord = document.getElementById('w-' + wordIndex);
    if (oldWord) {
      var cur = oldWord.getElementsByClassName('current-char');
      if (cur.length > 0) cur[0].className = cur[0].className.replace(' current-char', '');
    }

    wordHistory.push(val);
    wordIndex++;
    hiddenInput.value = '';

    if (cfg.mode === 'words') {
      wordsLeft--;
      timerVal.textContent = wordsLeft;
      if (wordsLeft <= 0) {
        finishTest();
        return;
      }
    }

    // Activate next word
    var nextWord = document.getElementById('w-' + wordIndex);
    if (nextWord && nextWord.children.length > 0) {
      nextWord.children[0].className += ' current-char';
      
      // Auto-scroll words container
      var wordTop = nextWord.offsetTop;
      var curMargin = Math.abs(parseInt(wordsInner.style.marginTop, 10) || 0);
      var wrapperH = wordsWrapper.clientHeight;

      if (wordTop > curMargin + wrapperH - 40) {
        wordsInner.style.marginTop = '-' + (wordTop - 6) + 'px';
      }
    }

    // Append more words buffer
    if (wordIndex >= activeWords.length - 15) {
      appendWords(40);
    }
  }

  function handleBackspace() {
    if (cfg.conf === 'max') return;

    if (hiddenInput.value.length === 0 && wordIndex > 0 && cfg.conf === 'off') {
      // Step back to previous word
      var curWord = document.getElementById('w-' + wordIndex);
      if (curWord) {
        var c = curWord.getElementsByClassName('current-char');
        if (c.length > 0) c[0].className = c[0].className.replace(' current-char', '');
      }

      wordIndex--;
      var restored = wordHistory.pop() || '';
      hiddenInput.value = restored;

      // Reset previous word's contribution from stats
      var targetWord = activeWords[wordIndex];
      var maxLen = Math.max(restored.length, targetWord.length);
      for (var i = 0; i < maxLen; i++) {
        if (i < restored.length && i < targetWord.length) {
          if (restored.charAt(i) === targetWord.charAt(i)) correctChars = Math.max(0, correctChars - 1);
          else incorrectChars = Math.max(0, incorrectChars - 1);
        } else {
          incorrectChars = Math.max(0, incorrectChars - 1);
        }
        rawChars = Math.max(0, rawChars - 1);
      }
      if (restored === targetWord) correctChars = Math.max(0, correctChars - 1);
      else incorrectChars = Math.max(0, incorrectChars - 1);
      rawChars = Math.max(0, rawChars - 1);

      updateWordDisplay();
    }
  }

  function appendWords(count) {
    var more = generateWords(count);
    var start = activeWords.length;
    for (var i = 0; i < more.length; i++) {
      activeWords.push(more[i]);
      var div = document.createElement('div');
      div.className = 'word';
      div.id = 'w-' + (start + i);
      for (var j = 0; j < more[i].length; j++) {
        div.innerHTML += '<span class="char c-sub">' + escapeHtml(more[i].charAt(j)) + '</span>';
      }
      wordsInner.appendChild(div);
    }
  }

  /* â”€â”€ Test Timers & Stats â”€â”€ */
  function startTest() {
    isRunning = true;
    startTime = Date.now();

    timerId = setInterval(function() {
      if (cfg.mode === 'time') {
        timeLeft--;
        timerVal.textContent = timeLeft;
        if (timeLeft <= 0) finishTest();
      }
      updateLiveStats();
    }, 1000);
  }

  function updateLiveStats() {
    var elapsed = (Date.now() - startTime) / 1000;
    if (elapsed < 0.3) return;

    var curCorrect = correctChars;
    var curIncorrect = incorrectChars;
    var val = hiddenInput.value;
    var target = activeWords[wordIndex] || '';

    for (var i = 0; i < val.length; i++) {
      if (i < target.length && val.charAt(i) === target.charAt(i)) curCorrect++;
      else curIncorrect++;
    }

    var wpm = Math.round((curCorrect / 5) / (elapsed / 60));
    if (isNaN(wpm) || wpm < 0) wpm = 0;

    var total = curCorrect + curIncorrect;
    var acc = total > 0 ? Math.round((curCorrect / total) * 100) : 100;

    liveWpmVal.textContent = wpm + ' wpm';
    liveAccVal.textContent = acc + '%';
  }

  function failTest(reason) {
    clearInterval(timerId);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    resWpmLarge.textContent = '0';
    resWpmLarge.className = 'c-err';
    resAcc.textContent = 'FAILED';
    resRaw.textContent = '0';
    resChars.textContent = reason;

    showResults();
  }

  function finishTest() {
    clearInterval(timerId);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    var elapsed = (Date.now() - startTime) / 1000;
    if (cfg.mode === 'time') elapsed = cfg.timeVal;
    if (elapsed <= 0) elapsed = 1;

    // Flush last word characters
    var val = hiddenInput.value;
    var target = activeWords[wordIndex] || '';
    for (var i = 0; i < val.length; i++) {
      if (i < target.length && val.charAt(i) === target.charAt(i)) correctChars++;
      else incorrectChars++;
      rawChars++;
    }

    var netWpm = Math.round((correctChars / 5) / (elapsed / 60));
    var rawWpm = Math.round((rawChars / 5) / (elapsed / 60));
    var total = correctChars + incorrectChars;
    var acc = total > 0 ? Math.round((correctChars / total) * 100) : 0;

    if (netWpm < 0) netWpm = 0;
    if (rawWpm < 0) rawWpm = 0;

    resWpmLarge.textContent = netWpm;
    resWpmLarge.className = 'c-main';
    resAcc.textContent = acc + '%';
    resRaw.textContent = rawWpm;
    resChars.textContent = correctChars + '/' + incorrectChars;

    savePB(netWpm);
    showResults();
  }

  function showResults() {
    wordsWrapper.style.display = 'none';
    document.getElementById('stats-row').style.display = 'none';
    resultsView.style.display = '-webkit-flex';
    resultsView.style.display = 'flex';
  }

  function resetTest() {
    clearInterval(timerId);
    isRunning = false;
    isFinished = false;
    wordIndex = 0;
    wordHistory = [];

    correctChars = 0;
    incorrectChars = 0;
    rawChars = 0;

    if (cfg.mode === 'time') {
      timeLeft = cfg.timeVal;
      timerVal.textContent = cfg.timeVal;
    } else {
      wordsLeft = cfg.wordsVal;
      timerVal.textContent = cfg.wordsVal;
    }

    liveWpmVal.textContent = '0 wpm';
    liveAccVal.textContent = '100%';
    hiddenInput.value = '';
    hiddenInput.disabled = false;
    wordsInner.style.marginTop = '0px';

    wordsWrapper.style.display = 'block';
    document.getElementById('stats-row').style.display = '-webkit-flex';
    document.getElementById('stats-row').style.display = 'flex';
    resultsView.style.display = 'none';
    focusPrompt.style.display = 'none';

    var initCount = (cfg.mode === 'words') ? Math.max(cfg.wordsVal, 30) : 80;
    activeWords = generateWords(initCount);
    renderWordsDOM();

    setTimeout(function() { hiddenInput.focus(); }, 30);
  }

  /* â”€â”€ Event Listeners â”€â”€ */
  hiddenInput.addEventListener('input', function() {
    if (isFinished) return;
    if (!isRunning && hiddenInput.value.length > 0) startTest();
    updateWordDisplay();
  });

  hiddenInput.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;

    if (code === 9) { // Tab -> restart
      e.preventDefault();
      resetTest();
      return;
    }

    if (code === 27) { // Escape -> close modal or restart
      e.preventDefault();
      if (settingsModal.style.display === 'flex' || settingsModal.style.display === '-webkit-flex') {
        settingsModal.style.display = 'none';
        hiddenInput.focus();
      } else {
        resetTest();
      }
      return;
    }

    if (isFinished) {
      if (code === 13 || code === 32) {
        e.preventDefault();
        resetTest();
      }
      return;
    }

    if (code === 32) { // Space
      e.preventDefault();
      handleSpace();
      return;
    }

    if (code === 8) { // Backspace
      if (hiddenInput.value.length === 0) {
        e.preventDefault();
        handleBackspace();
      }
      return;
    }

    if (code === 13) { // Enter -> restart
      e.preventDefault();
      resetTest();
      return;
    }
  });

  window.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;
    if (code === 9) {
      e.preventDefault();
      resetTest();
      return;
    }
    if (document.activeElement !== hiddenInput && !isFinished) {
      hiddenInput.focus();
    }
  });

  /* Focus handling */
  hiddenInput.addEventListener('focus', function() { focusPrompt.style.display = 'none'; });
  hiddenInput.addEventListener('blur', function() {
    if (!isFinished && settingsModal.style.display !== 'flex' && settingsModal.style.display !== '-webkit-flex') {
      focusPrompt.style.display = '-webkit-flex';
      focusPrompt.style.display = 'flex';
    }
  });
  wordsWrapper.addEventListener('click', function() { hiddenInput.focus(); });
  focusPrompt.addEventListener('click', function() { hiddenInput.focus(); });

  /* Header quick modes */
  var headerBtns = document.getElementById('header-menu').getElementsByTagName('button');
  for (var h = 0; h < headerBtns.length; h++) {
    (function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var t = btn.getAttribute('data-type');
        if (!t) return;
        cfg.mode = t;
        if (t === 'time') cfg.timeVal = parseInt(btn.getAttribute('data-val'), 10);
        else cfg.wordsVal = parseInt(btn.getAttribute('data-val'), 10);
        saveSettings();
        applySettingsUI();
        resetTest();
      });
    })(headerBtns[h]);
  }

  /* Restart buttons */
  btnRestart.addEventListener('click', function() { resetTest(); });
  tryAgainBtn.addEventListener('click', function() { resetTest(); });

  /* Settings modal */
  btnSettings.addEventListener('click', function(e) {
    e.stopPropagation();
    settingsModal.style.display = '-webkit-flex';
    settingsModal.style.display = 'flex';
  });

  btnCloseSettings.addEventListener('click', function(e) {
    e.stopPropagation();
    settingsModal.style.display = 'none';
    hiddenInput.focus();
  });

  function bindSettingGroup(id, prop) {
    var g = document.getElementById(id);
    if (!g) return;
    var btns = g.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          cfg[prop] = btn.getAttribute('data-val');
          saveSettings();
          applySettingsUI();
          resetTest();
        });
      })(btns[i]);
    }
  }

  bindSettingGroup('grp-theme', 'theme');
  bindSettingGroup('grp-diff', 'diff');
  bindSettingGroup('grp-conf', 'conf');
  bindSettingGroup('grp-stop', 'stop');
  bindSettingGroup('grp-caret', 'caret');

  setPunct.addEventListener('click', function() {
    cfg.withPunct = !cfg.withPunct;
    saveSettings();
    applySettingsUI();
    resetTest();
  });

  setNum.addEventListener('click', function() {
    cfg.withNum = !cfg.withNum;
    saveSettings();
    applySettingsUI();
    resetTest();
  });

  /* â”€â”€ Init â”€â”€ */
  loadSettings();
  resetTest();
})();
</script>
</body>
