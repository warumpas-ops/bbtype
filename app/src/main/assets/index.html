  var resCorrect = document.getElementById('res-correct');
  var resIncorrect = document.getElementById('res-incorrect');
  var resTime = document.getElementById('res-time');
  var pbVal = document.getElementById('pb-val');
  var actionBtn = document.getElementById('action-btn');
  var btnRestart = document.getElementById('btn-restart');
  var modeTag = document.getElementById('mode-tag');
  var subModePills = document.getElementById('sub-mode-pills');
  var btnModeTime = document.getElementById('btn-mode-time');
  var btnModeWords = document.getElementById('btn-mode-words');
  var btnTogglePunct = document.getElementById('btn-toggle-punct');
  var btnToggleNum = document.getElementById('btn-toggle-num');
  var settingsDrawer = document.getElementById('settings-drawer');
  var openSettingsBtn = document.getElementById('open-settings-btn');
  var closeSettingsBtn = document.getElementById('close-settings-btn');

  /* â”€â”€ Sound Synthesizer (Web Audio API) â”€â”€ */
  var audioCtx = null;
  function playBeep(isError) {
    if (config.sound === 'off') return;
    if (isError && config.sound !== 'all') return;
    try {
      if (!audioCtx) {
        var AC = window.AudioContext || window.webkitAudioContext;
        if (AC) audioCtx = new AC();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (!audioCtx) return;

      var osc = audioCtx.createOscillator();
      var gain = audioCtx.createGain();
      var now = audioCtx.currentTime;

      if (isError) {
        osc.type = 'sawtooth';
        osc.frequency.setValueAtTime(160, now);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.08);
      } else {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(500 + Math.random() * 80, now);
        gain.gain.setValueAtTime(0.06, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.025);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.025);
      }
    } catch(e) {}
  }

  /* â”€â”€ Settings Load / Save â”€â”€ */
  function loadConfig() {
    try {
      var saved = localStorage.getItem('bbtype_cfg');
      if (saved) {
        var parsed = JSON.parse(saved);
        for (var k in parsed) { config[k] = parsed[k]; }
      }
    } catch(e) {}
    applyConfigUI();
  }

  function saveConfig() {
    try {
      localStorage.setItem('bbtype_cfg', JSON.stringify(config));
    } catch(e) {}
  }

  function applyConfigUI() {
    bodyEl.className = 'theme-' + config.theme;
    caretEl.className = 'bg-accent caret-' + config.caret;

    // Apply active classes to settings buttons
    setGroupActive('opt-theme', 'theme', config.theme);
    setGroupActive('opt-difficulty', 'diff', config.difficulty);
    setGroupActive('opt-confidence', 'conf', config.confidence);
    setGroupActive('opt-stoperror', 'stop', config.stopError);
    setGroupActive('opt-blind', 'blind', config.blind);
    setGroupActive('opt-caret', 'caret', config.caret);
    setGroupActive('opt-sound', 'snd', config.sound);

    // Mode bar buttons
    if (config.testType === 'time') {
      btnModeTime.className = 'mode-btn c-sub active';
      btnModeWords.className = 'mode-btn c-sub';
      renderSubModePills([15, 30, 60], config.timeVal);
    } else {
      btnModeTime.className = 'mode-btn c-sub';
      btnModeWords.className = 'mode-btn c-sub active';
      renderSubModePills([10, 25, 50, 100], config.wordsVal);
    }

    btnTogglePunct.className = 'mode-btn c-sub' + (config.withPunct ? ' active' : '');
    btnToggleNum.className = 'mode-btn c-sub' + (config.withNum ? ' active' : '');

    modeTag.textContent = config.difficulty + (config.blind === 'on' ? ' (blind)' : '');
    loadPB();
  }

  function setGroupActive(containerId, attrName, val) {
    var cont = document.getElementById(containerId);
    if (!cont) return;
    var btns = cont.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      if (btns[i].getAttribute('data-' + attrName) === val) {
        btns[i].className = 'set-btn active';
      } else {
        btns[i].className = 'set-btn';
      }
    }
  }

  function renderSubModePills(items, activeVal) {
    var html = '';
    for (var i = 0; i < items.length; i++) {
      var act = (items[i] === activeVal) ? ' active' : '';
      html += '<button class="mode-btn c-sub' + act + '" data-val="' + items[i] + '">' + items[i] + '</button>';
    }
    subModePills.innerHTML = html;

    var pillBtns = subModePills.getElementsByTagName('button');
    for (var j = 0; j < pillBtns.length; j++) {
      (function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          var v = parseInt(btn.getAttribute('data-val'), 10);
          if (config.testType === 'time') config.timeVal = v;
          else config.wordsVal = v;
          saveConfig();
          applyConfigUI();
          resetTest();
        });
      })(pillBtns[j]);
    }
  }

  /* â”€â”€ PB Storage â”€â”€ */
  function getPBKey() {
    return 'bbtype_pb_' + config.testType + '_' + (config.testType === 'time' ? config.timeVal : config.wordsVal);
  }

  function loadPB() {
    try {
      var val = localStorage.getItem(getPBKey()) || '0';
      pbVal.textContent = val;
    } catch(e) { pbVal.textContent = '0'; }
  }

  function updatePB(wpm) {
    try {
      var key = getPBKey();
      var cur = parseInt(localStorage.getItem(key) || '0', 10);
      if (wpm > cur) {
        localStorage.setItem(key, wpm);
        pbVal.textContent = wpm;
      }
    } catch(e) {}
  }

  /* â”€â”€ Words Generation â”€â”€ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function generateWords(count) {
    var pool = shuffle(WORDS_POOL);
    var list = [];
    var puncs = ['.', ',', '!', '?', ';', '-'];

    for (var i = 0; i < count; i++) {
      var w = pool[i % pool.length];
      if (config.withNum && Math.random() < 0.15) {
        w = String(Math.floor(Math.random() * 900 + 10));
      } else if (config.withPunct) {
        var r = Math.random();
        if (r < 0.15) w = w.charAt(0).toUpperCase() + w.slice(1);
        if (r < 0.22) {
          var p = puncs[Math.floor(Math.random() * puncs.length)];
          w = w + p;
        }
      }
      list.push(w);
    }
    return list;
  }

  /* â”€â”€ Ultra-Fast DOM Pre-rendering â”€â”€ */
  function buildWordsDOM() {
    var html = '';
    for (var i = 0; i < activeWords.length; i++) {
      var w = activeWords[i];
      html += '<div class="word" id="w-' + i + '">';
      for (var j = 0; j < w.length; j++) {
        html += '<span class="char c-sub" id="c-' + i + '-' + j + '">' + escapeHtml(w.charAt(j)) + '</span>';
      }
      html += '</div>';
    }
    wordsInner.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* â”€â”€ Dynamic Caret Positioning (0ms Lag) â”€â”€ */
  function updateCaret() {
    var wordEl = document.getElementById('w-' + wordIndex);
    if (!wordEl) return;

    var leftPos = 0;
    var topPos = wordEl.offsetTop;

    if (charIndex < activeWords[wordIndex].length) {
      var charEl = document.getElementById('c-' + wordIndex + '-' + charIndex);
      if (charEl) {
        leftPos = charEl.offsetLeft;
        topPos = charEl.offsetTop;
      }
    } else {
      // At the end of the word or beyond extra chars
      var lastSpan = wordEl.lastElementChild;
      if (lastSpan) {
        leftPos = lastSpan.offsetLeft + lastSpan.offsetWidth;
        topPos = lastSpan.offsetTop;
      } else {
        leftPos = wordEl.offsetLeft;
      }
    }

    caretEl.style.left = leftPos + 'px';
    caretEl.style.top = topPos + 'px';

    // Auto-scroll words container if needed
    var wrapperH = wordsWrapper.clientHeight;
    var curMargin = Math.abs(parseInt(wordsInner.style.marginTop, 10) || 0);

    if (topPos > curMargin + wrapperH - 34) {
      var newMargin = topPos - 4;
      wordsInner.style.marginTop = '-' + newMargin + 'px';
    } else if (topPos < curMargin) {
      wordsInner.style.marginTop = '-' + Math.max(0, topPos - 4) + 'px';
    }
  }

  /* â”€â”€ Dynamic Character-by-Character Lighting (Instant Reaction) â”€â”€ */
  function onKeyPressChar(char) {
    if (isFinished) return;
    if (!isRunning) startTest();

    var targetWord = activeWords[wordIndex];

    // Stop on Error (Letter mode): block if wrong letter
    if (config.stopError === 'letter' && charIndex < targetWord.length) {
      if (char !== targetWord.charAt(charIndex)) {
        playBeep(true);
        return;
      }
    }

    var expectedChar = (charIndex < targetWord.length) ? targetWord.charAt(charIndex) : null;
    var isCorrect = (char === expectedChar);

    // Master Difficulty: Sudden Death on any incorrect character
    if (config.difficulty === 'master' && !isCorrect) {
      playBeep(true);
      failTest('Master Mode: 100% Accuracy Required');
      return;
    }

    // Play click sound
    playBeep(!isCorrect);

    typedWordChars.push(char);

    var wordEl = document.getElementById('w-' + wordIndex);

    if (charIndex < targetWord.length) {
      // Normal within-word character lighting
      var span = document.getElementById('c-' + wordIndex + '-' + charIndex);
      if (span) {
        if (config.blind === 'on') {
          span.className = 'char c-text';
        } else {
          span.className = 'char ' + (isCorrect ? 'c-text' : 'c-err');
        }
      }
    } else {
      // Extra characters typed past word length
      var extraSpan = document.createElement('span');
      extraSpan.className = 'char ' + (config.blind === 'on' ? 'c-text' : 'c-err') + ' extra-char';
      extraSpan.textContent = char;
      wordEl.appendChild(extraSpan);
    }

    charIndex++;
    stats.rawChars++;
    if (isCorrect) stats.correctChars++;
    else stats.incorrectChars++;

    updateCaret();
    updateLiveStats();
  }

  function onBackspace() {
    if (isFinished) return;

    // Confidence max: no backspace allowed
    if (config.confidence === 'max') return;

    if (charIndex > 0) {
      // Backspace within the current word
      charIndex--;
      var removed = typedWordChars.pop();
      var targetWord = activeWords[wordIndex];
      var wordEl = document.getElementById('w-' + wordIndex);

      if (charIndex < targetWord.length) {
        var span = document.getElementById('c-' + wordIndex + '-' + charIndex);
        if (span) {
          span.className = 'char c-sub';
        }
      } else {
        // Remove extra char node
        var last = wordEl.lastElementChild;
        if (last && last.className.indexOf('extra-char') !== -1) {
          wordEl.removeChild(last);
        }
      }

      updateCaret();
      updateLiveStats();
    } else if (wordIndex > 0 && config.confidence === 'off') {
      // Jump back to previous word (if confidence mode is off)
      wordIndex--;
      typedWordChars = wordHistory.pop() || [];
      charIndex = typedWordChars.length;
      updateCaret();
      updateLiveStats();
    }
  }

  function onSpace() {
    if (isFinished || charIndex === 0) return;

    var targetWord = activeWords[wordIndex];
    var isWordExact = (typedWordChars.join('') === targetWord);

    // Stop on Error (Word mode): cannot submit if misspelled
    if (config.stopError === 'word' && !isWordExact) {
      playBeep(true);
      return;
    }

    // Expert Difficulty: Sudden Death if submitted word is wrong
    if (config.difficulty === 'expert' && !isWordExact) {
      playBeep(true);
      failTest('Expert Mode: Misspelled Word');
      return;
    }

    // Space counts as correct keystroke if word was correct
    if (isWordExact) stats.correctChars++;
    else stats.incorrectChars++;
    stats.rawChars++;

    wordHistory.push(typedWordChars);
    wordIndex++;
    charIndex = 0;
    typedWordChars = [];

    // Words mode progress
    if (config.testType === 'words') {
      wordsLeft--;
      timerBox.textContent = wordsLeft;
      if (wordsLeft <= 0) {
        finishTest();
        return;
      }
    }

    // Append more words dynamically if nearing buffer end
    if (wordIndex >= activeWords.length - 12) {
      appendMoreWords(40);
    }

    updateCaret();
    updateLiveStats();
  }

  function appendMoreWords(count) {
    var more = generateWords(count);
    var startIdx = activeWords.length;
    for (var i = 0; i < more.length; i++) {
      activeWords.push(more[i]);
      var div = document.createElement('div');
      div.className = 'word';
      div.id = 'w-' + (startIdx + i);
      for (var j = 0; j < more[i].length; j++) {
        div.innerHTML += '<span class="char c-sub" id="c-' + (startIdx + i) + '-' + j + '">' + escapeHtml(more[i].charAt(j)) + '</span>';
      }
      wordsInner.appendChild(div);
    }
  }

  /* â”€â”€ Live Stats & Timers â”€â”€ */
  function startTest() {
    isRunning = true;
    startTime = Date.now();

    if (config.testType === 'time') {
      timerInterval = setInterval(function() {
        timeLeft--;
        timerBox.textContent = timeLeft;
        updateLiveStats();
        if (timeLeft <= 0) finishTest();
      }, 1000);
    } else {
      timerInterval = setInterval(function() {
        updateLiveStats();
      }, 500);
    }
  }

  function updateLiveStats() {
    var elapsedSec = (Date.now() - startTime) / 1000;
    if (elapsedSec < 0.2) return;

    var wpm = Math.round((stats.correctChars / 5) / (elapsedSec / 60));
    if (isNaN(wpm) || wpm < 0) wpm = 0;

    var total = stats.correctChars + stats.incorrectChars;
    var acc = total > 0 ? Math.round((stats.correctChars / total) * 100) : 100;

    liveWpm.textContent = wpm + ' wpm';
    liveAcc.textContent = acc + '%';
  }

  function failTest(reason) {
    clearInterval(timerInterval);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    resWpm.textContent = '0';
    resAcc.textContent = 'FAILED';
    resRaw.textContent = '0';
    resCorrect.textContent = stats.correctChars;
    resIncorrect.textContent = stats.incorrectChars;
    resTime.textContent = reason;

    showResults();
  }

  function finishTest() {
    clearInterval(timerInterval);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    var elapsedSec = (Date.now() - startTime) / 1000;
    if (config.testType === 'time') elapsedSec = config.timeVal;
    if (elapsedSec <= 0) elapsedSec = 1;

    var netWpm = Math.round((stats.correctChars / 5) / (elapsedSec / 60));
    var rawWpm = Math.round((stats.rawChars / 5) / (elapsedSec / 60));
    var total = stats.correctChars + stats.incorrectChars;
    var acc = total > 0 ? Math.round((stats.correctChars / total) * 100) : 0;

    if (netWpm < 0) netWpm = 0;
    if (rawWpm < 0) rawWpm = 0;

    resWpm.textContent = netWpm;
    resAcc.textContent = acc + '%';
    resRaw.textContent = rawWpm;
    resCorrect.textContent = stats.correctChars;
    resIncorrect.textContent = stats.incorrectChars;
    resTime.textContent = Math.round(elapsedSec) + 's';

    updatePB(netWpm);
    showResults();
  }

  function showResults() {
    wordsWrapper.style.display = 'none';
    document.getElementById('stats-row').style.display = 'none';
    resultsScreen.style.display = '-webkit-flex';
    resultsScreen.style.display = 'flex';
  }

  function resetTest() {
    clearInterval(timerInterval);
    isRunning = false;
    isFinished = false;
    wordIndex = 0;
    charIndex = 0;
    typedWordChars = [];
    wordHistory = [];

    stats.correctChars = 0;
    stats.incorrectChars = 0;
    stats.rawChars = 0;

    if (config.testType === 'time') {
      timeLeft = config.timeVal;
      timerBox.textContent = config.timeVal;
    } else {
      wordsLeft = config.wordsVal;
      timerBox.textContent = config.wordsVal;
    }

    liveWpm.textContent = '0 wpm';
    liveAcc.textContent = '100%';
    hiddenInput.value = '';
    hiddenInput.disabled = false;
    wordsInner.style.marginTop = '0px';

    wordsWrapper.style.display = 'block';
    document.getElementById('stats-row').style.display = '-webkit-flex';
    document.getElementById('stats-row').style.display = 'flex';
    resultsScreen.style.display = 'none';
    focusOverlay.style.display = 'none';

    var totalInitialWords = (config.testType === 'words') ? Math.max(config.wordsVal, 30) : 70;
    activeWords = generateWords(totalInitialWords);
    buildWordsDOM();
    updateCaret();

    setTimeout(function() {
      hiddenInput.focus();
    }, 40);
  }

  /* â”€â”€ Keystroke Event Dispatcher â”€â”€ */
  hiddenInput.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;

    // Tab (9) or Escape (27) -> Restart
    if (code === 9) {
      e.preventDefault();
      resetTest();
      return;
    }

    if (code === 27) {
      e.preventDefault();
      if (settingsDrawer.style.display === 'flex' || settingsDrawer.style.display === '-webkit-flex') {
        closeSettings();
      } else {
        resetTest();
      }
      return;
    }

    if (isFinished) {
      if (code === 13 || code === 32) { // Enter or Space on results
        e.preventDefault();
        resetTest();
      }
      return;
    }

    // Space (32)
    if (code === 32) {
      e.preventDefault();
      onSpace();
      return;
    }

    // Backspace (8)
    if (code === 8) {
      e.preventDefault();
      onBackspace();
      return;
    }

    // Enter (13) -> Restart test
    if (code === 13) {
      e.preventDefault();
      resetTest();
      return;
    }
  });

  // Direct character capture via input event (handles physical keyboard + Android runtime)
  hiddenInput.addEventListener('input', function(e) {
    if (isFinished) return;
    var val = hiddenInput.value;
    if (!val || val.length === 0) return;

    for (var i = 0; i < val.length; i++) {
      var c = val.charAt(i);
      if (c === ' ') {
        onSpace();
      } else {
        onKeyPressChar(c);
      }
    }
    hiddenInput.value = '';
  });

  // Global window fallback for physical keyboard
  window.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;
    if (code === 9) {
      e.preventDefault();
      resetTest();
      return;
    }
    if (document.activeElement !== hiddenInput && !isFinished) {
      hiddenInput.focus();
    }
  });

  /* â”€â”€ Focus Management â”€â”€ */
  hiddenInput.addEventListener('focus', function() {
    focusOverlay.style.display = 'none';
  });

  hiddenInput.addEventListener('blur', function() {
    if (!isFinished && settingsDrawer.style.display !== 'flex' && settingsDrawer.style.display !== '-webkit-flex') {
      focusOverlay.style.display = '-webkit-flex';
      focusOverlay.style.display = 'flex';
    }
  });

  wordsWrapper.addEventListener('click', function() { hiddenInput.focus(); });
  focusOverlay.addEventListener('click', function() { hiddenInput.focus(); });

  /* â”€â”€ Mode Switching Buttons â”€â”€ */
  btnModeTime.addEventListener('click', function() {
    config.testType = 'time';
    saveConfig();
    applyConfigUI();
    resetTest();
  });

  btnModeWords.addEventListener('click', function() {
    config.testType = 'words';
    saveConfig();
    applyConfigUI();
    resetTest();
  });

  btnTogglePunct.addEventListener('click', function() {
    config.withPunct = !config.withPunct;
    saveConfig();
    applyConfigUI();
    resetTest();
  });

  btnToggleNum.addEventListener('click', function() {
    config.withNum = !config.withNum;
    saveConfig();
    applyConfigUI();
    resetTest();
  });

  btnRestart.addEventListener('click', function() { resetTest(); });
  actionBtn.addEventListener('click', function() { resetTest(); });

  /* â”€â”€ Settings Drawer Management â”€â”€ */
  function openSettings() {
    settingsDrawer.style.display = '-webkit-flex';
    settingsDrawer.style.display = 'flex';
  }

  function closeSettings() {
    settingsDrawer.style.display = 'none';
    hiddenInput.focus();
  }

  openSettingsBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    openSettings();
  });

  closeSettingsBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    closeSettings();
  });

  // Settings option clicks
  function setupSettingGroup(groupId, configKey, attrName) {
    var grp = document.getElementById(groupId);
    if (!grp) return;
    var btns = grp.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          config[configKey] = btn.getAttribute('data-' + attrName);
          saveConfig();
          applyConfigUI();
          resetTest();
        });
      })(btns[i]);
    }
  }

  setupSettingGroup('opt-theme', 'theme', 'theme');
  setupSettingGroup('opt-difficulty', 'difficulty', 'diff');
  setupSettingGroup('opt-confidence', 'confidence', 'conf');
  setupSettingGroup('opt-stoperror', 'stopError', 'stop');
  setupSettingGroup('opt-blind', 'blind', 'blind');
  setupSettingGroup('opt-caret', 'caret', 'caret');
  setupSettingGroup('opt-sound', 'sound', 'snd');

  /* â”€â”€ Init â”€â”€ */
  loadConfig();
  resetTest();
})();
</script>
