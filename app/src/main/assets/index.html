<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BBType â€” Monkeytype for BlackBerry</title>
<style>
* {
  margin: 0;
  padding: 0;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  background-color: #323437;
  color: #d1d0c5;
  font-family: "Consolas", "Courier New", Courier, monospace;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

#app-container {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  height: 100%;
  max-width: 720px;
  margin: 0 auto;
  padding: 10px 14px 6px;
}

/* â”€â”€ Top Bar â”€â”€ */
#top-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding-bottom: 6px;
  border-bottom: 1px solid #3c3e41;
}

#logo {
  font-size: 18px;
  font-weight: bold;
  color: #e2b714;
  letter-spacing: 1.5px;
}

#logo span {
  color: #646669;
  font-weight: normal;
  font-size: 14px;
}

#pb-badge {
  font-size: 12px;
  color: #646669;
}
#pb-val {
  color: #e2b714;
  font-weight: bold;
}

/* â”€â”€ Control Bar â”€â”€ */
#control-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  margin: 8px 0 6px;
  background: #2c2e31;
  border-radius: 6px;
  padding: 4px 8px;
}

.pill-group {
  display: inline-block;
  margin: 0 4px;
}

.pill-btn {
  background: none;
  border: none;
  color: #646669;
  font-family: "Consolas", "Courier New", Courier, monospace;
  font-size: 13px;
  padding: 4px 10px;
  cursor: pointer;
  border-radius: 4px;
  outline: none;
}

.pill-btn.active {
  color: #e2b714;
  background-color: #323437;
  font-weight: bold;
}

.pill-divider {
  display: inline-block;
  width: 1px;
  height: 14px;
  background-color: #444649;
  margin: 0 6px;
  vertical-align: middle;
}

/* â”€â”€ Live Stats Bar â”€â”€ */
#live-stats-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  height: 36px;
  margin-bottom: 4px;
  padding: 0 4px;
}

#timer-display {
  font-size: 26px;
  font-weight: bold;
  color: #e2b714;
  min-width: 44px;
}

#live-stats-right {
  font-size: 13px;
  color: #646669;
}
#live-wpm {
  color: #e2b714;
  font-weight: bold;
  margin-right: 10px;
}
#live-acc {
  color: #d1d0c5;
}

/* â”€â”€ Words Display Area â”€â”€ */
#words-container {
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  position: relative;
  overflow: hidden;
  height: 120px;
  max-height: 130px;
  margin-bottom: 8px;
  cursor: text;
}

#words-inner {
  position: relative;
  -webkit-transition: margin-top 0.12s ease-out;
  transition: margin-top 0.12s ease-out;
  padding: 2px 0;
}

.word {
  display: inline-block;
  margin: 0 8px 6px 0;
  font-size: 19px;
  line-height: 26px;
  vertical-align: top;
  white-space: nowrap;
}

.char {
  color: #646669;
  position: relative;
}

.word.active .char {
  color: #646669;
}

.char.correct {
  color: #d1d0c5;
}

.char.incorrect {
  color: #ca4754;
  text-decoration: underline;
}

.char.extra {
  color: #7e2a33;
}

/* Caret / Cursor */
.caret {
  display: inline-block;
  width: 2px;
  height: 22px;
  background-color: #e2b714;
  vertical-align: middle;
  margin-top: -2px;
  position: absolute;
  -webkit-animation: caretBlink 1s infinite;
  animation: caretBlink 1s infinite;
}

@-webkit-keyframes caretBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}
@keyframes caretBlink {
  0%, 100% { opacity: 1; }
  50% { opacity: 0; }
}

/* â”€â”€ Hidden Input â”€â”€ */
#hidden-input {
  position: absolute;
  left: -9999px;
  top: 0;
  opacity: 0;
  width: 1px;
  height: 1px;
  font-size: 16px;
  border: none;
  outline: none;
}

/* â”€â”€ Focus overlay warning â”€â”€ */
#focus-prompt {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(50, 52, 55, 0.85);
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  color: #e2b714;
  font-size: 14px;
  cursor: pointer;
  border-radius: 6px;
  z-index: 10;
}

/* â”€â”€ Bottom Controls â”€â”€ */
#bottom-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding-top: 4px;
  border-top: 1px solid #3c3e41;
}

.bottom-btn {
  background: none;
  border: none;
  color: #646669;
  font-family: "Consolas", "Courier New", Courier, monospace;
  font-size: 12px;
  padding: 6px 12px;
  cursor: pointer;
  border-radius: 4px;
  outline: none;
}
.bottom-btn:hover, .bottom-btn:active {
  color: #d1d0c5;
}

#restart-shortcut {
  font-size: 11px;
  color: #505255;
}

/* â”€â”€ Results View â”€â”€ */
#results-view {
  display: none;
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  text-align: center;
  padding: 8px 0;
}

#results-grid {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  width: 100%;
  margin-bottom: 12px;
}

.res-col {
  padding: 0 16px;
}

.res-primary-val {
  font-size: 54px;
  font-weight: bold;
  color: #e2b714;
  line-height: 1;
}

.res-primary-lbl {
  font-size: 13px;
  color: #646669;
  margin-top: 4px;
}

.res-secondary-val {
  font-size: 32px;
  font-weight: bold;
  color: #d1d0c5;
  line-height: 1;
  margin-top: 14px;
}

#results-breakdown {
  background: #2c2e31;
  border-radius: 6px;
  padding: 8px 16px;
  margin-bottom: 14px;
  font-size: 12px;
  color: #646669;
  width: 90%;
  max-width: 440px;
}

#results-breakdown span {
  color: #d1d0c5;
  font-weight: bold;
}

#try-again-btn {
  background: #e2b714;
  color: #2c2e31;
  border: none;
  font-family: "Consolas", "Courier New", Courier, monospace;
  font-size: 15px;
  font-weight: bold;
  padding: 8px 24px;
  border-radius: 6px;
  cursor: pointer;
  outline: none;
}
#try-again-btn:active {
  background: #d1a60f;
}
</style>
</head>
<body>

<div id="app-container">
  <!-- Top Bar -->
  <div id="top-bar">
    <div id="logo">bb<span>type</span></div>
    <div id="pb-badge">PB: <span id="pb-val">0</span> wpm</div>
  </div>

  <!-- Mode Selector -->
  <div id="control-bar">
    <div class="pill-group" id="time-pills">
      <button class="pill-btn" data-time="15">15</button>
      <button class="pill-btn active" data-time="30">30</button>
      <button class="pill-btn" data-time="60">60</button>
    </div>
    <div class="pill-divider"></div>
    <div class="pill-group">
      <button class="pill-btn" id="toggle-punct">@ punct</button>
      <button class="pill-btn" id="toggle-num"># num</button>
    </div>
  </div>

  <!-- Live Stats -->
  <div id="live-stats-bar">
    <div id="timer-display">30</div>
    <div id="live-stats-right">
      <span id="live-wpm">0 wpm</span>
      <span id="live-acc">100%</span>
    </div>
  </div>

  <!-- Words Area -->
  <div id="words-container">
    <div id="words-inner"></div>
    <div id="focus-prompt">Click / Tap here or start typing</div>
  </div>

  <!-- Results Screen -->
  <div id="results-view">
    <div id="results-grid">
      <div class="res-col">
        <div class="res-primary-val" id="res-wpm">0</div>
        <div class="res-primary-lbl">wpm</div>
      </div>
      <div class="res-col">
        <div class="res-secondary-val" id="res-acc">0%</div>
        <div class="res-primary-lbl">acc</div>
      </div>
    </div>
    <div id="results-breakdown">
      raw: <span id="res-raw">0</span> &nbsp;|&nbsp;
      chars: <span id="res-correct" style="color:#d1d0c5">0</span>/<span id="res-incorrect" style="color:#ca4754">0</span> &nbsp;|&nbsp;
      time: <span id="res-time">30s</span>
    </div>
    <button id="try-again-btn">â†» Next Test (Enter / Tab)</button>
  </div>

  <!-- Hidden Input -->
  <input type="text" id="hidden-input" autocomplete="off" autocapitalize="off" autocorrect="off" spellcheck="false">

  <!-- Bottom Bar -->
  <div id="bottom-bar">
    <button class="bottom-btn" id="restart-btn">â†» Restart</button>
    <div id="restart-shortcut">tab / enter to restart</div>
    <button class="bottom-btn" id="sound-btn">â™ª Sound: OFF</button>
  </div>
</div>

<script>
(function() {
  /* â”€â”€ 300 Common English Words â”€â”€ */
  var BASE_WORDS = [
    'the','be','of','and','a','to','in','he','have','it','that','for',
    'they','with','as','not','on','she','at','by','this','we','you','do',
    'but','from','or','which','one','would','all','will','there','say',
    'who','make','when','can','more','if','no','man','out','other','so',
    'what','time','up','go','about','than','into','could','only','new',
    'year','some','take','come','these','know','see','use','get','like',
    'then','first','any','work','now','may','such','give','over','think',
    'most','even','find','day','also','after','way','many','must','look',
    'before','great','back','through','long','where','much','should',
    'well','people','down','own','just','because','good','each','those',
    'feel','seem','how','high','too','place','little','world','very',
    'still','hand','old','life','tell','write','here','show','house',
    'both','between','need','mean','call','under','last','right','move',
    'thing','school','never','same','begin','while','number','part',
    'turn','real','leave','might','want','point','form','off','child',
    'few','small','since','ask','late','home','large','end','open',
    'follow','again','hold','around','head','word','keep','face','group',
    'play','stand','early','course','change','help','line','city','put',
    'close','case','force','meet','once','water','upon','war','build',
    'hear','light','live','every','country','bring','let','side','try',
    'name','run','read','door','set','order','eye','plan','air','story',
    'power','grow','best','night','start','stop','add','love','far',
    'idea','often','above','learn','real','team','does','room','land',
    'body','car','earth','food','sure','watch','next','left','always',
    'feel','sound','water','keep','plant','father','tree','never','city',
    'press','close','night','real','life','few','north','book','carry',
    'took','science','eat','room','friend','began','idea','fish','mountain',
    'stop','once','base','hear','horse','cut','sure','watch','color',
    'face','wood','main','enough','plain','girl','usual','young','ready',
    'above','ever','red','list','though','feel','talk','bird','soon',
    'body','dog','family','direct','pose','leave','song','measure','state',
    'product','black','short','numeral','class','wind','question','happen',
    'complete','ship','area','half','rock','order','fire','south','problem',
    'piece','told','knew','pass','farm','top','whole','king','size','heard',
    'best','hour','better','true','during','hundred','am','remember','step',
    'early','hold','west','ground','interest','reach','fast','five','sing',
    'listen','six','table','travel','less','morning','ten','simple','several',
    'vowel','toward','war','lay','against','pattern','slow','center','love',
    'person','money','serve','appear','road','map','rain','rule','govern',
    'pull','cold','notice','voice','fall','power','town','fine','certain',
    'fly','unit','lead','cry','dark','machine','note','wait','plan','figure',
    'star','box','noun','field','rest','correct','able','pound','done'
  ];

  /* â”€â”€ State â”€â”€ */
  var testDuration = 30;
  var timeLeft = 30;
  var timerInterval = null;
  var isRunning = false;
  var isFinished = false;
  var startTime = 0;
  var soundEnabled = false;

  var withPunctuation = false;
  var withNumbers = false;

  var wordQueue = [];
  var activeWordIndex = 0;
  var currentInputStr = "";
  var wordHistory = []; // stores user's typed string for each completed word

  var totalCorrectChars = 0;
  var totalIncorrectChars = 0;
  var totalRawTypedChars = 0;

  /* â”€â”€ Audio Context (Web Audio API Synthesizer) â”€â”€ */
  var audioCtx = null;
  function playKeyClick() {
    if (!soundEnabled) return;
    try {
      if (!audioCtx) {
        var AudioContext = window.AudioContext || window.webkitAudioContext;
        if (AudioContext) audioCtx = new AudioContext();
      }
      if (audioCtx && audioCtx.state === 'suspended') {
        audioCtx.resume();
      }
      if (audioCtx) {
        var osc = audioCtx.createOscillator();
        var gain = audioCtx.createGain();
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440 + Math.random() * 60, audioCtx.currentTime);
        gain.gain.setValueAtTime(0.08, audioCtx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.03);
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start();
        osc.stop(audioCtx.currentTime + 0.03);
      }
    } catch(e) {}
  }

  /* â”€â”€ DOM References â”€â”€ */
  var timerDisplay = document.getElementById('timer-display');
  var liveWpmDisplay = document.getElementById('live-wpm');
  var liveAccDisplay = document.getElementById('live-acc');
  var wordsContainer = document.getElementById('words-container');
  var wordsInner = document.getElementById('words-inner');
  var focusPrompt = document.getElementById('focus-prompt');
  var hiddenInput = document.getElementById('hidden-input');
  var resultsView = document.getElementById('results-view');
  var resWpm = document.getElementById('res-wpm');
  var resAcc = document.getElementById('res-acc');
  var resRaw = document.getElementById('res-raw');
  var resCorrect = document.getElementById('res-correct');
  var resIncorrect = document.getElementById('res-incorrect');
  var resTime = document.getElementById('res-time');
  var pbVal = document.getElementById('pb-val');
  var restartBtn = document.getElementById('restart-btn');
  var tryAgainBtn = document.getElementById('try-again-btn');
  var soundBtn = document.getElementById('sound-btn');
  var togglePunct = document.getElementById('toggle-punct');
  var toggleNum = document.getElementById('toggle-num');

  /* â”€â”€ LocalStorage PB â”€â”€ */
  function loadPB() {
    try {
      var saved = localStorage.getItem('bbtype_pb_' + testDuration);
      if (saved) {
        pbVal.textContent = saved;
      } else {
        pbVal.textContent = "0";
      }
    } catch(e) { pbVal.textContent = "0"; }
  }

  function savePB(wpm) {
    try {
      var cur = parseInt(localStorage.getItem('bbtype_pb_' + testDuration) || "0", 10);
      if (wpm > cur) {
        localStorage.setItem('bbtype_pb_' + testDuration, wpm);
        pbVal.textContent = wpm;
      }
    } catch(e) {}
  }

  /* â”€â”€ Word Generation â”€â”€ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var temp = a[i]; a[i] = a[j]; a[j] = temp;
    }
    return a;
  }

  function generateWordBatch(count) {
    var pool = shuffle(BASE_WORDS);
    var list = [];
    var puncs = ['.', ',', '!', '?', ';', '"', '-'];

    for (var i = 0; i < count; i++) {
      var w = pool[i % pool.length];
      if (withNumbers && Math.random() < 0.15) {
        w = String(Math.floor(Math.random() * 900 + 10));
      } else if (withPunctuation) {
        var r = Math.random();
        if (r < 0.12) {
          w = w.charAt(0).toUpperCase() + w.slice(1);
        }
        if (r < 0.20) {
          var p = puncs[Math.floor(Math.random() * puncs.length)];
          if (p === '"') w = '"' + w + '"';
          else w = w + p;
        }
      }
      list.push(w);
    }
    return list;
  }

  /* â”€â”€ Rendering â”€â”€ */
  function renderAllWords() {
    var html = '';
    for (var i = 0; i < wordQueue.length; i++) {
      var w = wordQueue[i];
      var cls = 'word';
      if (i === activeWordIndex) cls += ' active';
      html += '<div class="' + cls + '" id="w-' + i + '">';
      for (var j = 0; j < w.length; j++) {
        html += '<span class="char">' + escapeHtml(w.charAt(j)) + '</span>';
      }
      html += '</div>';
    }
    wordsInner.innerHTML = html;
  }

  function escapeHtml(str) {
    return str.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function updateActiveWordDisplay() {
    var wordEl = document.getElementById('w-' + activeWordIndex);
    if (!wordEl) return;

    var targetWord = wordQueue[activeWordIndex];
    var typed = currentInputStr;
    var html = '';

    for (var i = 0; i < targetWord.length; i++) {
      var targetChar = targetWord.charAt(i);
      var cClass = 'char';

      if (i < typed.length) {
        var typedChar = typed.charAt(i);
        if (typedChar === targetChar) {
          cClass += ' correct';
        } else {
          cClass += ' incorrect';
        }
      }

      var caretHtml = (i === typed.length) ? '<span class="caret"></span>' : '';
      html += '<span class="' + cClass + '">' + caretHtml + escapeHtml(targetChar) + '</span>';
    }

    // Extra chars typed beyond word length
    if (typed.length > targetWord.length) {
      for (var k = targetWord.length; k < typed.length; k++) {
        html += '<span class="char extra incorrect">' + escapeHtml(typed.charAt(k)) + '</span>';
      }
      html += '<span class="caret"></span>';
    } else if (typed.length === targetWord.length) {
      html += '<span class="caret"></span>';
    }

    wordEl.innerHTML = html;
  }

  function scrollIfNeeded() {
    var wordEl = document.getElementById('w-' + activeWordIndex);
    if (!wordEl) return;

    var containerTop = wordsContainer.offsetTop;
    var containerH = wordsContainer.clientHeight;
    var wordTop = wordEl.offsetTop;
    var wordH = wordEl.offsetHeight;

    if (wordTop - wordsInner.offsetTop > containerH - wordH - 10) {
      var newMargin = wordTop - 8;
      wordsInner.style.marginTop = '-' + newMargin + 'px';
    }
  }

  /* â”€â”€ Test Lifecycle â”€â”€ */
  function startTest() {
    isRunning = true;
    startTime = Date.now();
    timerInterval = setInterval(function() {
      timeLeft--;
      timerDisplay.textContent = timeLeft;
      updateLiveStats();
      if (timeLeft <= 0) {
        finishTest();
      }
    }, 1000);
  }

  function updateLiveStats() {
    var elapsedSeconds = (Date.now() - startTime) / 1000;
    if (elapsedSeconds <= 0.2) return;

    var curCorrect = totalCorrectChars;
    var curIncorrect = totalIncorrectChars;

    // Check active word partially
    var target = wordQueue[activeWordIndex] || "";
    for (var i = 0; i < currentInputStr.length; i++) {
      if (i < target.length && currentInputStr.charAt(i) === target.charAt(i)) {
        curCorrect++;
      } else {
        curIncorrect++;
      }
    }

    var wpm = Math.round((curCorrect / 5) / (elapsedSeconds / 60));
    if (isNaN(wpm) || wpm < 0) wpm = 0;

    var totalTyped = curCorrect + curIncorrect;
    var acc = totalTyped > 0 ? Math.round((curCorrect / totalTyped) * 100) : 100;

    liveWpmDisplay.textContent = wpm + ' wpm';
    liveAccDisplay.textContent = acc + '%';
  }

  function submitWord() {
    var target = wordQueue[activeWordIndex];
    var typed = currentInputStr;
    wordHistory.push(typed);

    var maxLen = Math.max(target.length, typed.length);
    var wordIsExact = (typed === target);

    for (var i = 0; i < maxLen; i++) {
      if (i < target.length && i < typed.length) {
        if (typed.charAt(i) === target.charAt(i)) {
          totalCorrectChars++;
        } else {
          totalIncorrectChars++;
        }
      } else {
        totalIncorrectChars++;
      }
      totalRawTypedChars++;
    }

    // Space counted as correct keystroke if word matched
    if (wordIsExact) {
      totalCorrectChars++;
    } else {
      totalIncorrectChars++;
    }
    totalRawTypedChars++;

    var oldEl = document.getElementById('w-' + activeWordIndex);
    if (oldEl) {
      oldEl.className = 'word typed' + (wordIsExact ? '' : ' has-error');
      // Clean up caret from previous word
      var spans = oldEl.getElementsByTagName('span');
      var cleanHtml = '';
      for (var s = 0; s < target.length; s++) {
        var cor = (s < typed.length && typed.charAt(s) === target.charAt(s));
        cleanHtml += '<span class="char ' + (cor ? 'correct' : 'incorrect') + '">' + escapeHtml(target.charAt(s)) + '</span>';
      }
      for (var ex = target.length; ex < typed.length; ex++) {
        cleanHtml += '<span class="char extra incorrect">' + escapeHtml(typed.charAt(ex)) + '</span>';
      }
      oldEl.innerHTML = cleanHtml;
    }

    activeWordIndex++;
    currentInputStr = "";
    hiddenInput.value = "";

    // Append more words if approaching end
    if (activeWordIndex >= wordQueue.length - 10) {
      var more = generateWordBatch(50);
      for (var m = 0; m < more.length; m++) {
        wordQueue.push(more[m]);
        var div = document.createElement('div');
        div.className = 'word';
        div.id = 'w-' + (wordQueue.length - 1);
        for (var c = 0; c < more[m].length; c++) {
          div.innerHTML += '<span class="char">' + escapeHtml(more[m].charAt(c)) + '</span>';
        }
        wordsInner.appendChild(div);
      }
    }

    var nextEl = document.getElementById('w-' + activeWordIndex);
    if (nextEl) {
      nextEl.className = 'word active';
      updateActiveWordDisplay();
    }

    scrollIfNeeded();
    updateLiveStats();
  }

  function handleBackspaceToPrevWord() {
    if (activeWordIndex <= 0) return;

    var prevEl = document.getElementById('w-' + activeWordIndex);
    if (prevEl) prevEl.className = 'word';

    activeWordIndex--;
    var restoredTyped = wordHistory.pop() || "";
    currentInputStr = restoredTyped;
    hiddenInput.value = restoredTyped;

    // Recalculate stats by removing last word's contribution
    var target = wordQueue[activeWordIndex];
    var maxLen = Math.max(target.length, restoredTyped.length);
    var wordIsExact = (restoredTyped === target);

    for (var i = 0; i < maxLen; i++) {
      if (i < target.length && i < restoredTyped.length) {
        if (restoredTyped.charAt(i) === target.charAt(i)) {
          totalCorrectChars = Math.max(0, totalCorrectChars - 1);
        } else {
          totalIncorrectChars = Math.max(0, totalIncorrectChars - 1);
        }
      } else {
        totalIncorrectChars = Math.max(0, totalIncorrectChars - 1);
      }
      totalRawTypedChars = Math.max(0, totalRawTypedChars - 1);
    }
    if (wordIsExact) {
      totalCorrectChars = Math.max(0, totalCorrectChars - 1);
    } else {
      totalIncorrectChars = Math.max(0, totalIncorrectChars - 1);
    }
    totalRawTypedChars = Math.max(0, totalRawTypedChars - 1);

    var curEl = document.getElementById('w-' + activeWordIndex);
    if (curEl) {
      curEl.className = 'word active';
      updateActiveWordDisplay();
    }
    scrollIfNeeded();
  }

  function finishTest() {
    clearInterval(timerInterval);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    // Flush current input
    if (currentInputStr.length > 0) {
      var target = wordQueue[activeWordIndex] || "";
      for (var i = 0; i < currentInputStr.length; i++) {
        if (i < target.length && currentInputStr.charAt(i) === target.charAt(i)) {
          totalCorrectChars++;
        } else {
          totalIncorrectChars++;
        }
        totalRawTypedChars++;
      }
    }

    var totalTyped = totalCorrectChars + totalIncorrectChars;
    var accuracy = totalTyped > 0 ? Math.round((totalCorrectChars / totalTyped) * 100) : 0;
    var netWpm = Math.round((totalCorrectChars / 5) / (testDuration / 60));
    var rawWpm = Math.round((totalRawTypedChars / 5) / (testDuration / 60));
    if (netWpm < 0) netWpm = 0;
    if (rawWpm < 0) rawWpm = 0;

    resWpm.textContent = netWpm;
    resAcc.textContent = accuracy + '%';
    resRaw.textContent = rawWpm;
    resCorrect.textContent = totalCorrectChars;
    resIncorrect.textContent = totalIncorrectChars;
    resTime.textContent = testDuration + 's';

    savePB(netWpm);

    wordsContainer.style.display = 'none';
    document.getElementById('live-stats-bar').style.display = 'none';
    resultsView.style.display = '-webkit-flex';
    resultsView.style.display = 'flex';
  }

  function resetTest() {
    clearInterval(timerInterval);
    isRunning = false;
    isFinished = false;
    activeWordIndex = 0;
    currentInputStr = "";
    wordHistory = [];
    totalCorrectChars = 0;
    totalIncorrectChars = 0;
    totalRawTypedChars = 0;
    timeLeft = testDuration;

    timerDisplay.textContent = testDuration;
    liveWpmDisplay.textContent = '0 wpm';
    liveAccDisplay.textContent = '100%';

    hiddenInput.disabled = false;
    hiddenInput.value = "";
    wordsInner.style.marginTop = '0px';

    wordsContainer.style.display = 'block';
    document.getElementById('live-stats-bar').style.display = '-webkit-flex';
    document.getElementById('live-stats-bar').style.display = 'flex';
    resultsView.style.display = 'none';
    focusPrompt.style.display = 'none';

    loadPB();
    wordQueue = generateWordBatch(80);
    renderAllWords();
    updateActiveWordDisplay();

    setTimeout(function() {
      hiddenInput.focus();
    }, 50);
  }

  /* â”€â”€ Keyboard & Input Event Handling â”€â”€ */
  hiddenInput.addEventListener('input', function(e) {
    if (isFinished) return;

    if (!isRunning && hiddenInput.value.length > 0) {
      startTest();
    }

    currentInputStr = hiddenInput.value;
    playKeyClick();
    updateActiveWordDisplay();
    updateLiveStats();
  });

  hiddenInput.addEventListener('keydown', function(e) {
    var key = e.keyCode || e.which;

    // Tab (9) or Escape (27) -> Restart
    if (key === 9 || key === 27) {
      e.preventDefault();
      resetTest();
      return;
    }

    if (isFinished) {
      // Enter (13) or Space (32) restarts if finished
      if (key === 13 || key === 32) {
        e.preventDefault();
        resetTest();
      }
      return;
    }

    // Space (32) -> Advance word
    if (key === 32) {
      e.preventDefault();
      if (currentInputStr.length === 0) return;
      playKeyClick();
      submitWord();
      return;
    }

    // Enter (13) -> Restart or submit word
    if (key === 13) {
      e.preventDefault();
      resetTest();
      return;
    }

    // Backspace (8) at beginning of word -> Go back to previous word
    if (key === 8 && currentInputStr.length === 0 && activeWordIndex > 0) {
      e.preventDefault();
      handleBackspaceToPrevWord();
      return;
    }
  });

  // Global keydown fallback for physical keyboard
  window.addEventListener('keydown', function(e) {
    var key = e.keyCode || e.which;
    if (key === 9) {
      e.preventDefault();
      resetTest();
      return;
    }
    if (document.activeElement !== hiddenInput && !isFinished) {
      hiddenInput.focus();
    }
  });

  /* â”€â”€ Focus Management â”€â”€ */
  hiddenInput.addEventListener('focus', function() {
    focusPrompt.style.display = 'none';
  });

  hiddenInput.addEventListener('blur', function() {
    if (!isFinished) {
      focusPrompt.style.display = '-webkit-flex';
      focusPrompt.style.display = 'flex';
    }
  });

  wordsContainer.addEventListener('click', function() {
    hiddenInput.focus();
  });

  focusPrompt.addEventListener('click', function() {
    hiddenInput.focus();
  });

  /* â”€â”€ Time Pills â”€â”€ */
  var timeBtns = document.getElementById('time-pills').getElementsByTagName('button');
  for (var tb = 0; tb < timeBtns.length; tb++) {
    (function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var t = parseInt(btn.getAttribute('data-time'), 10);
        testDuration = t;
        for (var j = 0; j < timeBtns.length; j++) {
          timeBtns[j].className = 'pill-btn';
        }
        btn.className = 'pill-btn active';
        resetTest();
      });
    })(timeBtns[tb]);
  }

  /* â”€â”€ Punctuation / Number Toggles â”€â”€ */
  togglePunct.addEventListener('click', function(e) {
    e.stopPropagation();
    withPunctuation = !withPunctuation;
    togglePunct.className = 'pill-btn' + (withPunctuation ? ' active' : '');
    resetTest();
  });

  toggleNum.addEventListener('click', function(e) {
    e.stopPropagation();
    withNumbers = !withNumbers;
    toggleNum.className = 'pill-btn' + (withNumbers ? ' active' : '');
    resetTest();
  });

  /* â”€â”€ Sound Toggle â”€â”€ */
  soundBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    soundEnabled = !soundEnabled;
    soundBtn.textContent = 'â™ª Sound: ' + (soundEnabled ? 'ON' : 'OFF');
    soundBtn.style.color = soundEnabled ? '#e2b714' : '#646669';
    if (soundEnabled) playKeyClick();
    hiddenInput.focus();
  });

  /* â”€â”€ Restart Buttons â”€â”€ */
  restartBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    resetTest();
  });

  tryAgainBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    resetTest();
  });

  /* â”€â”€ Init â”€â”€ */
  resetTest();
})();
</script>
