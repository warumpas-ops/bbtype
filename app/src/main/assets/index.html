/* â”€â”€ App Container â”€â”€ */

/* â”€â”€ Live Stats Bar â”€â”€ */
#stats-row {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;

}

/* â”€â”€ Typing Area â”€â”€ */
#words-wrapper {
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  position: relative;
  overflow: hidden;
  margin: 4px 0;
  cursor: text;
}

#words-inner {
  position: relative;
  -webkit-transition: margin-top 0.1s ease-out;
  transition: margin-top 0.1s ease-out;
  padding-top: 2px;
}

.word {
  display: inline-block;
  margin: 0 10px 10px 0;
  font-size: 21px;
  line-height: 30px;
  vertical-align: top;
  white-space: nowrap;
}

.char {
  position: relative;
}

/* Caret styles (0 forced reflows) */
.caret-bar .current-char {
  border-left: 2px solid #e2b714;
  margin-left: -1px;
  padding-left: 1px;
  -webkit-animation: blinkBar 0.9s infinite;
  animation: blinkBar 0.9s infinite;
}

.caret-block .current-char {
  background-color: rgba(226, 183, 20, 0.35);
  border-radius: 2px;
  -webkit-animation: blinkBlock 0.9s infinite;
  animation: blinkBlock 0.9s infinite;
}

.caret-underline .current-char {
  border-bottom: 2px solid #e2b714;
  -webkit-animation: blinkBar 0.9s infinite;
  animation: blinkBar 0.9s infinite;
}

body.theme-matrix .caret-bar .current-char { border-color: #00ff66; }
body.theme-matrix .caret-block .current-char { background-color: rgba(0, 255, 102, 0.35); }
body.theme-matrix .caret-underline .current-char { border-color: #00ff66; }

body.theme-dracula .caret-bar .current-char { border-color: #bd93f9; }
body.theme-dracula .caret-block .current-char { background-color: rgba(189, 147, 249, 0.35); }
body.theme-dracula .caret-underline .current-char { border-color: #bd93f9; }

body.theme-paper .caret-bar .current-char { border-color: #c62828; }
body.theme-paper .caret-block .current-char { background-color: rgba(198, 40, 40, 0.35); }
body.theme-paper .caret-underline .current-char { border-color: #c62828; }

@-webkit-keyframes blinkBar { 0%, 100% { border-color: inherit; } 50% { border-color: transparent; } }
@keyframes blinkBar { 0%, 100% { border-color: inherit; } 50% { border-color: transparent; } }

@-webkit-keyframes blinkBlock { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
@keyframes blinkBlock { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }

/* â”€â”€ Hidden Input â”€â”€ */
#hidden-input {
  position: absolute;
  left: -9999px;
  top: 0;
  opacity: 0;
  width: 1px;
  height: 1px;
  border: none;
  outline: none;
}

.bot-btn {

#results-view {

.res-sub-val {
  font-size: 14px;

#res-actions-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: center;
  -webkit-justify-content: center;

  /* â”€â”€ Runtime State â”€â”€ */
  var activeWords = [];
  var wordIndex = 0;
  var wordHistory = []; // past typed strings

  var isFinished = false;
  var timerId = null;

  var timeLeft = 15;

  var correctChars = 0;
  var incorrectChars = 0;
  var extraChars = 0;
  var missedChars = 0;
  var rawChars = 0;

  // Chart data timeline: array of { second, wpm, raw, errors }
  var chartData = [];

  var container = document.getElementById('app-container');

  /* â”€â”€ Persistence â”€â”€ */
  function loadSettings() {
    try {
      var saved = localStorage.getItem('bbtype_v2_cfg');
      if (saved) {
        var parsed = JSON.parse(saved);
        for (var k in parsed) { cfg[k] = parsed[k]; }
      }
    } catch(e) {}
    applySettingsUI();
  }

  function saveSettings() {
    try {
      localStorage.setItem('bbtype_v2_cfg', JSON.stringify(cfg));
    } catch(e) {}
  }

  function applySettingsUI() {
    document.body.className = 'theme-' + cfg.theme;
    container.className = 'caret-' + cfg.caret;

    // Header pills
    var headerBtns = document.getElementById('header-menu').getElementsByTagName('button');
    for (var i = 0; i < headerBtns.length; i++) {
      var btn = headerBtns[i];
      var t = btn.getAttribute('data-type');
      var v = parseInt(btn.getAttribute('data-val'), 10);
      if (t === cfg.mode && ((t === 'time' && v === cfg.timeVal) || (t === 'words' && v === cfg.wordsVal))) {
        btn.className = 'pill-btn c-main active';
      } else if (btn.id !== 'btn-settings') {
        btn.className = 'pill-btn c-sub';
      }
    }

    // Settings group buttons
    syncGroupActive('grp-theme', cfg.theme);
    syncGroupActive('grp-diff', cfg.diff);
    syncGroupActive('grp-conf', cfg.conf);
    syncGroupActive('grp-stop', cfg.stop);
    syncGroupActive('grp-caret', cfg.caret);

    setPunct.className = 'set-btn' + (cfg.withPunct ? ' active' : '');
    setNum.className = 'set-btn' + (cfg.withNum ? ' active' : '');

    loadPB();
  }

  function syncGroupActive(id, val) {
    var g = document.getElementById(id);
    if (!g) return;
    var btns = g.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (btns[i].getAttribute('data-val') === val) ? 'set-btn active' : 'set-btn';
    }
  }

  function getPBKey() {
    return 'bbtype_pb_' + cfg.mode + '_' + (cfg.mode === 'time' ? cfg.timeVal : cfg.wordsVal);
  }

  function loadPB() {
    try {
      var val = localStorage.getItem(getPBKey()) || '0';
      pbTag.textContent = 'PB: ' + val;
    } catch(e) { pbTag.textContent = 'PB: 0'; }
  }

  function savePB(wpm) {
    try {
      var key = getPBKey();
      var cur = parseInt(localStorage.getItem(key) || '0', 10);
      if (wpm > cur) {
        localStorage.setItem(key, wpm);
        pbTag.textContent = 'PB: ' + wpm;
      }
    } catch(e) {}
  }

  /* â”€â”€ Words Generation â”€â”€ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function generateWords(count) {
    var pool = shuffle(WORDS);
    var list = [];
    var puncs = ['.', ',', '!', '?', ';', '-'];

    for (var i = 0; i < count; i++) {
      var w = pool[i % pool.length];
      if (cfg.withNum && Math.random() < 0.15) {
        w = String(Math.floor(Math.random() * 900 + 10));
      } else if (cfg.withPunct) {
        var r = Math.random();
        if (r < 0.15) w = w.charAt(0).toUpperCase() + w.slice(1);
        if (r < 0.22) w = w + puncs[Math.floor(Math.random() * puncs.length)];
      }
      list.push(w);
    }
    return list;
  }

  /* â”€â”€ Pre-render Words DOM â”€â”€ */
  function renderWordsDOM() {
    var html = '';
    for (var i = 0; i < activeWords.length; i++) {
      var w = activeWords[i];
      html += '<div class="word" id="w-' + i + '">';
      for (var j = 0; j < w.length; j++) {
        var cls = 'char c-sub';
        if (i === 0 && j === 0) cls += ' current-char';
        html += '<span class="' + cls + '">' + escapeHtml(w.charAt(j)) + '</span>';
      }
      html += '</div>';
    }
    wordsInner.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* â”€â”€ Fast Input Handling â”€â”€ */
  function updateWordDisplay() {
    var wordEl = document.getElementById('w-' + wordIndex);
    if (!wordEl) return;

    var val = hiddenInput.value;
    var targetWord = activeWords[wordIndex];
    var spans = wordEl.children;

    for (var i = 0; i < targetWord.length; i++) {
      var span = spans[i];
      if (!span) continue;

      if (i < val.length) {
        var isMatch = (val.charAt(i) === targetWord.charAt(i));
        span.className = 'char ' + (isMatch ? 'c-text' : 'c-err');
        if (!isMatch) errorsThisSecond++;
      } else if (i === val.length) {
        span.className = 'char c-sub current-char';
      } else {
        span.className = 'char c-sub';
      }
    }

    // Extra characters
    var existingExtras = wordEl.getElementsByClassName('extra-char');
    while (existingExtras.length > 0) {
      existingExtras[0].parentNode.removeChild(existingExtras[0]);
    }

    if (val.length > targetWord.length) {
      for (var k = targetWord.length; k < val.length; k++) {
        var extra = document.createElement('span');
        extra.className = 'char c-err extra-char';
        if (k === val.length - 1) extra.className += ' current-char';
        extra.textContent = val.charAt(k);
        wordEl.appendChild(extra);
        errorsThisSecond++;
      }
    }

    // Master mode sudden death
    if (cfg.diff === 'master') {
      for (var m = 0; m < val.length; m++) {
        if (m < targetWord.length && val.charAt(m) !== targetWord.charAt(m)) {
          failTest('Master: 100% Accuracy Required');
          return;
        }
      }
    }

    // Stop on error (letter)
    if (cfg.stop === 'letter' && val.length > 0) {
      var lastIdx = val.length - 1;
      if (lastIdx < targetWord.length && val.charAt(lastIdx) !== targetWord.charAt(lastIdx)) {
        hiddenInput.value = val.substring(0, lastIdx);
        updateWordDisplay();
        return;
      }
    }
  }

  function handleSpace() {
    var val = hiddenInput.value;
    if (val.length === 0) return;

    var targetWord = activeWords[wordIndex];
    var isExact = (val === targetWord);

    // Stop on error (word)
    if (cfg.stop === 'word' && !isExact) return;

    // Expert sudden death
    if (cfg.diff === 'expert' && !isExact) {
      failTest('Expert: Word Misspelled');
      return;
    }

    // Calculate characters
    var maxLen = Math.max(val.length, targetWord.length);
    for (var i = 0; i < maxLen; i++) {
      if (i < val.length && i < targetWord.length) {
        if (val.charAt(i) === targetWord.charAt(i)) correctChars++;
        else incorrectChars++;
      } else if (i >= targetWord.length) {
        extraChars++;
        incorrectChars++;
      } else {
        missedChars++;
      }
      rawChars++;
    }
    if (isExact) correctChars++;
    else incorrectChars++;
    rawChars++;

    var oldWord = document.getElementById('w-' + wordIndex);
    if (oldWord) {
      var cur = oldWord.getElementsByClassName('current-char');
      if (cur.length > 0) cur[0].className = cur[0].className.replace(' current-char', '');
    }

    wordHistory.push(val);
    wordIndex++;
    hiddenInput.value = '';

    if (cfg.mode === 'words') {
      wordsLeft--;
      timerVal.textContent = wordsLeft;
      if (wordsLeft <= 0) {
        finishTest();
        return;
      }
    }

    var nextWord = document.getElementById('w-' + wordIndex);
    if (nextWord && nextWord.children.length > 0) {
      nextWord.children[0].className += ' current-char';
      
      var wordTop = nextWord.offsetTop;
      var curMargin = Math.abs(parseInt(wordsInner.style.marginTop, 10) || 0);
      var wrapperH = wordsWrapper.clientHeight;

      if (wordTop > curMargin + wrapperH - 40) {
        wordsInner.style.marginTop = '-' + (wordTop - 6) + 'px';
      }
    }

    if (wordIndex >= activeWords.length - 15) {
      appendWords(40);
    }
  }

  function handleBackspace() {
    if (cfg.conf === 'max') return;

    if (hiddenInput.value.length === 0 && wordIndex > 0 && cfg.conf === 'off') {
      var curWord = document.getElementById('w-' + wordIndex);
      if (curWord) {
        var c = curWord.getElementsByClassName('current-char');
        if (c.length > 0) c[0].className = c[0].className.replace(' current-char', '');
      }

      wordIndex--;
      var restored = wordHistory.pop() || '';
      hiddenInput.value = restored;

      var targetWord = activeWords[wordIndex];
      var maxLen = Math.max(restored.length, targetWord.length);
      for (var i = 0; i < maxLen; i++) {
        if (i < restored.length && i < targetWord.length) {
          if (restored.charAt(i) === targetWord.charAt(i)) correctChars = Math.max(0, correctChars - 1);
          else incorrectChars = Math.max(0, incorrectChars - 1);
        } else if (i >= targetWord.length) {
          extraChars = Math.max(0, extraChars - 1);
          incorrectChars = Math.max(0, incorrectChars - 1);
        } else {
          missedChars = Math.max(0, missedChars - 1);
        }
        rawChars = Math.max(0, rawChars - 1);
      }
      if (restored === targetWord) correctChars = Math.max(0, correctChars - 1);
      else incorrectChars = Math.max(0, incorrectChars - 1);
      rawChars = Math.max(0, rawChars - 1);

      updateWordDisplay();
    }
  }

  function appendWords(count) {
    var more = generateWords(count);
    var start = activeWords.length;
    for (var i = 0; i < more.length; i++) {
      activeWords.push(more[i]);
      var div = document.createElement('div');
      div.className = 'word';
      div.id = 'w-' + (start + i);
      for (var j = 0; j < more[i].length; j++) {
        div.innerHTML += '<span class="char c-sub">' + escapeHtml(more[i].charAt(j)) + '</span>';
      }
      wordsInner.appendChild(div);
    }
  }

  /* â”€â”€ Timers, Samples, & Graph â”€â”€ */
  function startTest() {
    isRunning = true;
    startTime = Date.now();
    chartData = [];
    errorsThisSecond = 0;

    var secCounter = 0;
    timerId = setInterval(function() {
      secCounter++;
      if (cfg.mode === 'time') {
        timeLeft--;
        timerVal.textContent = timeLeft;
        if (timeLeft <= 0) finishTest();
      }

      // Record second snapshot for chart
      var elapsed = (Date.now() - startTime) / 1000;
      var curWpm = Math.round((correctChars / 5) / (elapsed / 60)) || 0;
      var curRaw = Math.round((rawChars / 5) / (elapsed / 60)) || 0;

      chartData.push({
        second: secCounter,
        wpm: curWpm,
        raw: curRaw,
        errors: errorsThisSecond
      });
      errorsThisSecond = 0;

      updateLiveStats();
    }, 1000);
  }

  function updateLiveStats() {
    var elapsed = (Date.now() - startTime) / 1000;
    if (elapsed < 0.3) return;

    var curCorrect = correctChars;
    var curIncorrect = incorrectChars;
    var val = hiddenInput.value;
    var target = activeWords[wordIndex] || '';

    for (var i = 0; i < val.length; i++) {
      if (i < target.length && val.charAt(i) === target.charAt(i)) curCorrect++;
      else curIncorrect++;
    }

    var wpm = Math.round((curCorrect / 5) / (elapsed / 60));
    if (isNaN(wpm) || wpm < 0) wpm = 0;

    var total = curCorrect + curIncorrect;
    var acc = total > 0 ? Math.round((curCorrect / total) * 100) : 100;

    liveWpmVal.textContent = wpm + ' wpm';
    liveAccVal.textContent = acc + '%';
  }

  function failTest(reason) {
    clearInterval(timerId);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    resWpmNum.textContent = '0';
    resWpmNum.className = 'res-hero-val c-err';
    resAccNum.textContent = 'FAIL';
    resRawNum.textContent = '0';
    resCharsNum.textContent = reason;
    resConsNum.textContent = '0%';
    resTimeNum.textContent = '0s';

    showResults(0, 0, 0, 0);
  }

  function finishTest() {
    clearInterval(timerId);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    var elapsed = (Date.now() - startTime) / 1000;
    if (cfg.mode === 'time') elapsed = cfg.timeVal;
    if (elapsed <= 0) elapsed = 1;

    // Flush last word
    var val = hiddenInput.value;
    var target = activeWords[wordIndex] || '';
    for (var i = 0; i < val.length; i++) {
      if (i < target.length && val.charAt(i) === target.charAt(i)) correctChars++;
      else incorrectChars++;
      rawChars++;
    }

    var netWpm = Math.round((correctChars / 5) / (elapsed / 60));
    var rawWpm = Math.round((rawChars / 5) / (elapsed / 60));
    var total = correctChars + incorrectChars;
    var acc = total > 0 ? Math.round((correctChars / total) * 100) : 0;

    if (netWpm < 0) netWpm = 0;
    if (rawWpm < 0) rawWpm = 0;

    // Calculate Consistency %
    var wpmSamples = [];
    for (var s = 0; s < chartData.length; s++) {
      wpmSamples.push(chartData[s].wpm);
    }
    var consistency = calculateConsistency(wpmSamples);

    resWpmNum.textContent = netWpm;
    resWpmNum.className = 'res-hero-val c-main';
    resAccNum.textContent = acc + '%';
    resTestType.textContent = cfg.mode + ' ' + (cfg.mode === 'time' ? cfg.timeVal : cfg.wordsVal);
    resRawNum.textContent = rawWpm;
    resCharsNum.textContent = correctChars + '/' + incorrectChars + '/' + extraChars + '/' + missedChars;
    resConsNum.textContent = consistency + '%';
    resTimeNum.textContent = Math.round(elapsed) + 's';

    savePB(netWpm);
    showResults(netWpm, rawWpm, acc, consistency);
  }

  function calculateConsistency(samples) {
    if (!samples || samples.length < 2) return 100;
    var sum = 0;
    for (var i = 0; i < samples.length; i++) sum += samples[i];
    var mean = sum / samples.length;
    if (mean <= 0) return 100;

    var varSum = 0;
    for (var j = 0; j < samples.length; j++) {
      var d = samples[j] - mean;
      varSum += d * d;
    }
    var stdDev = Math.sqrt(varSum / samples.length);
    var cv = (stdDev / mean) * 100;
    return Math.max(0, Math.min(100, Math.round(100 - cv)));
  }

  function showResults() {
    wordsWrapper.style.display = 'none';
    document.getElementById('stats-row').style.display = 'none';
    resultsView.style.display = '-webkit-flex';
    resultsView.style.display = 'flex';
    wordsHistoryPanel.style.display = 'none';

    // Render Canvas Chart
    setTimeout(function() {
      drawResultChart();
    }, 50);
  }

  /* â”€â”€ Pure HTML5 Canvas Result Chart (Zero External Libs) â”€â”€ */
  function drawResultChart() {
    if (!resCanvas) return;
    var rect = resCanvas.getBoundingClientRect();
    var dpr = window.devicePixelRatio || 1;
    var width = rect.width || 320;
    var height = rect.height || 95;

    resCanvas.width = width * dpr;
    resCanvas.height = height * dpr;

    var ctx = resCanvas.getContext('2d');
    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    if (chartData.length < 1) return;

    var paddingLeft = 24;
    var paddingRight = 14;
    var paddingTop = 12;
    var paddingBottom = 16;

    var plotW = width - paddingLeft - paddingRight;
    var plotH = height - paddingTop - paddingBottom;

    // Find max WPM for scaling
    var maxWpm = 40;
    for (var i = 0; i < chartData.length; i++) {
      if (chartData[i].raw > maxWpm) maxWpm = chartData[i].raw;
      if (chartData[i].wpm > maxWpm) maxWpm = chartData[i].wpm;
    }
    maxWpm = Math.ceil(maxWpm / 20) * 20 + 20;

    // Grid lines & labels
    ctx.font = '9px Consolas, monospace';
    ctx.fillStyle = '#646669';
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = '#3d3f42';
    ctx.lineWidth = 1;

    var steps = 3;
    for (var s = 0; s <= steps; s++) {
      var val = Math.round((maxWpm / steps) * s);
      var y = paddingTop + plotH - (s / steps) * plotH;
      ctx.beginPath();
      ctx.moveTo(paddingLeft, y);
      ctx.lineTo(width - paddingRight, y);
      ctx.stroke();
      if (s > 0) ctx.fillText(val, paddingLeft - 4, y);
    }

    var totalPoints = Math.max(chartData.length, 2);

    function getX(idx) {
      return paddingLeft + (idx / (totalPoints - 1)) * plotW;
    }
    function getY(w) {
      return paddingTop + plotH - (w / maxWpm) * plotH;
    }

    // 1. Draw Raw WPM Line (Dashed grey)
    ctx.beginPath();
    ctx.strokeStyle = '#646669';
    ctx.lineWidth = 1.5;
    ctx.setLineDash([2, 3]);
    for (var r = 0; r < chartData.length; r++) {
      var rx = getX(r);
      var ry = getY(chartData[r].raw);
      if (r === 0) ctx.moveTo(rx, ry);
      else ctx.lineTo(rx, ry);
    }
    ctx.stroke();
    ctx.setLineDash([]); // Reset line dash

    // 2. Draw Net WPM Line with Fill (Gold / Accent)
    var themeColor = '#e2b714';
    if (cfg.theme === 'matrix') themeColor = '#00ff66';
    if (cfg.theme === 'dracula') themeColor = '#bd93f9';
    if (cfg.theme === 'carbon') themeColor = '#ffffff';
    if (cfg.theme === 'paper') themeColor = '#c62828';

    ctx.beginPath();
    for (var w = 0; w < chartData.length; w++) {
      var wx = getX(w);
      var wy = getY(chartData[w].wpm);
      if (w === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.strokeStyle = themeColor;
    ctx.lineWidth = 2.5;
    ctx.stroke();

    // 3. Draw Error Markers (Red Ã— dots)
    ctx.fillStyle = '#ca4754';
    ctx.font = 'bold 10px Consolas, monospace';
    ctx.textAlign = 'center';
    for (var e = 0; e < chartData.length; e++) {
      if (chartData[e].errors > 0) {
        var ex = getX(e);
        ctx.fillText('Ã—', ex, paddingTop + 2);
      }
    }

    // 4. X-Axis Time Ticks
    ctx.fillStyle = '#646669';
    ctx.font = '8px Consolas, monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var xStep = Math.max(1, Math.floor(chartData.length / 5));
    for (var t = 0; t < chartData.length; t += xStep) {
      ctx.fillText(chartData[t].second, getX(t), paddingTop + plotH + 3);
    }
    if (chartData.length > 1 && (chartData.length - 1) % xStep !== 0) {
      ctx.fillText(chartData[chartData.length - 1].second, getX(chartData.length - 1), paddingTop + plotH + 3);
    }
  }

  /* â”€â”€ Words History Panel â”€â”€ */
  function renderWordsHistory() {
    var html = '';
    for (var i = 0; i < wordHistory.length; i++) {
      var typed = wordHistory[i];
      var target = activeWords[i] || '';
      var isOk = (typed === target);
      html += '<span class="hist-word ' + (isOk ? 'correct' : 'incorrect') + '">' + escapeHtml(typed) + '</span>';
    }
    wordsHistoryPanel.innerHTML = html || 'No words recorded';
  }

  function resetTest(repeatSameWords) {
    clearInterval(timerId);
    isRunning = false;
    isFinished = false;
    wordIndex = 0;
    wordHistory = [];
    chartData = [];
    errorsThisSecond = 0;

    correctChars = 0;
    incorrectChars = 0;
    extraChars = 0;
    missedChars = 0;
    rawChars = 0;

    if (cfg.mode === 'time') {
      timeLeft = cfg.timeVal;
      timerVal.textContent = cfg.timeVal;
    } else {
      wordsLeft = cfg.wordsVal;
      timerVal.textContent = cfg.wordsVal;
    }

    liveWpmVal.textContent = '0 wpm';
    liveAccVal.textContent = '100%';
    hiddenInput.value = '';
    hiddenInput.disabled = false;
    wordsInner.style.marginTop = '0px';

    wordsWrapper.style.display = 'block';
    document.getElementById('stats-row').style.display = '-webkit-flex';
    document.getElementById('stats-row').style.display = 'flex';
    resultsView.style.display = 'none';
    focusPrompt.style.display = 'none';

    if (!repeatSameWords) {
      var initCount = (cfg.mode === 'words') ? Math.max(cfg.wordsVal, 30) : 80;
      activeWords = generateWords(initCount);
    }
    renderWordsDOM();

    setTimeout(function() { hiddenInput.focus(); }, 30);
  }

  /* â”€â”€ Event Handlers â”€â”€ */
  hiddenInput.addEventListener('input', function() {
    if (isFinished) return;
    if (!isRunning && hiddenInput.value.length > 0) startTest();
    updateWordDisplay();
  });

  hiddenInput.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;

    if (code === 9) { // Tab -> restart
      e.preventDefault();
      resetTest(false);
      return;
    }

    if (code === 27) { // Escape -> close modal or restart
      e.preventDefault();
      if (settingsModal.style.display === 'flex' || settingsModal.style.display === '-webkit-flex') {
        settingsModal.style.display = 'none';
        hiddenInput.focus();
      } else {
        resetTest(false);
      }
      return;
    }

    if (isFinished) {
      if (code === 13 || code === 32) {
        e.preventDefault();
        resetTest(false);
      }
      return;
    }

    if (code === 32) { // Space
      e.preventDefault();
      handleSpace();
      return;
    }

    if (code === 8) { // Backspace
      if (hiddenInput.value.length === 0) {
        e.preventDefault();
        handleBackspace();
      }
      return;
    }

    if (code === 13) { // Enter -> restart
      e.preventDefault();
      resetTest(false);
      return;
    }
  });

  window.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;
    if (code === 9) {
      e.preventDefault();
      resetTest(false);
      return;
    }
    if (document.activeElement !== hiddenInput && !isFinished) {
      hiddenInput.focus();
    }
  });

  /* Focus handling */
  hiddenInput.addEventListener('focus', function() { focusPrompt.style.display = 'none'; });
  hiddenInput.addEventListener('blur', function() {
    if (!isFinished && settingsModal.style.display !== 'flex' && settingsModal.style.display !== '-webkit-flex') {
      focusPrompt.style.display = '-webkit-flex';
      focusPrompt.style.display = 'flex';
    }
  });
  wordsWrapper.addEventListener('click', function() { hiddenInput.focus(); });
  focusPrompt.addEventListener('click', function() { hiddenInput.focus(); });

  /* Header quick modes */
  var headerBtns = document.getElementById('header-menu').getElementsByTagName('button');
  for (var h = 0; h < headerBtns.length; h++) {
    (function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var t = btn.getAttribute('data-type');
        if (!t) return;
        cfg.mode = t;
        if (t === 'time') cfg.timeVal = parseInt(btn.getAttribute('data-val'), 10);
        else cfg.wordsVal = parseInt(btn.getAttribute('data-val'), 10);
        saveSettings();
        applySettingsUI();
        resetTest(false);
      });
    })(headerBtns[h]);
  }

  /* Result screen action buttons */
  btnResNext.addEventListener('click', function() { resetTest(false); });
  btnResRepeat.addEventListener('click', function() { resetTest(true); });
  btnResWords.addEventListener('click', function() {
    if (wordsHistoryPanel.style.display === 'block') {
      wordsHistoryPanel.style.display = 'none';
    } else {
      renderWordsHistory();
      wordsHistoryPanel.style.display = 'block';
    }
  });

  btnRestart.addEventListener('click', function() { resetTest(false); });

  /* Settings modal */
  btnSettings.addEventListener('click', function(e) {
    e.stopPropagation();
    settingsModal.style.display = '-webkit-flex';
    settingsModal.style.display = 'flex';
  });

  btnCloseSettings.addEventListener('click', function(e) {
    e.stopPropagation();
    settingsModal.style.display = 'none';
    hiddenInput.focus();
  });

  function bindSettingGroup(id, prop) {
    var g = document.getElementById(id);
    if (!g) return;
    var btns = g.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function() {
          cfg[prop] = btn.getAttribute('data-val');
          saveSettings();
          applySettingsUI();
          resetTest(false);
        });
      })(btns[i]);
    }
  }

  bindSettingGroup('grp-theme', 'theme');
  bindSettingGroup('grp-diff', 'diff');
  bindSettingGroup('grp-conf', 'conf');
  bindSettingGroup('grp-stop', 'stop');
  bindSettingGroup('grp-caret', 'caret');

  setPunct.addEventListener('click', function() {
    cfg.withPunct = !cfg.withPunct;
    saveSettings();
    applySettingsUI();
    resetTest(false);
  });

  setNum.addEventListener('click', function() {
    cfg.withNum = !cfg.withNum;
    saveSettings();
    applySettingsUI();
    resetTest(false);
  });

  /* â”€â”€ Init â”€â”€ */
  loadSettings();
  resetTest(false);
})();
</script>
</body>
</html>
