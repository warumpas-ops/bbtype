<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>BBType</title>
<style>
* {
  margin: 0;
  padding: 0;
  -webkit-box-sizing: border-box;
  box-sizing: border-box;
}

html, body {
  width: 100%;
  height: 100%;
  overflow: hidden;
  font-family: "Consolas", "Courier New", Courier, monospace;
  -webkit-user-select: none;
  user-select: none;
  -webkit-tap-highlight-color: transparent;
}

/* â”€â”€ 1. Monkeytype Theme (Default Dark) â”€â”€ */
body.theme-monkeytype { background-color: #323437; color: #d1d0c5; }
body.theme-monkeytype .c-main { color: #e2b714; }
body.theme-monkeytype .c-sub { color: #646669; }
body.theme-monkeytype .c-text { color: #d1d0c5; }
body.theme-monkeytype .c-err { color: #ca4754; }
body.theme-monkeytype .bg-panel { background-color: #2c2e31; }
body.theme-monkeytype .bg-accent { background-color: #e2b714; color: #2c2e31; }
body.theme-monkeytype #bottom-bar { border-top-color: #3d3f42; }
body.theme-monkeytype #res-bottom-grid { border-top-color: #3d3f42; }
body.theme-monkeytype .res-btn { background: #2c2e31; border: 1px solid #444; color: #d1d0c5; }
body.theme-monkeytype #settings-modal { background: rgba(30, 32, 35, 0.97); color: #d1d0c5; }
body.theme-monkeytype .set-row { border-bottom-color: #2f2f2f; }
body.theme-monkeytype .set-btn { background: #333; color: #888; }
body.theme-monkeytype .set-btn.active { background: #e2b714; color: #111; }
body.theme-monkeytype .caret-bar .current-char { border-left: 2px solid #e2b714; }
body.theme-monkeytype .caret-block .current-char { background-color: rgba(226, 183, 20, 0.35); }
body.theme-monkeytype .caret-underline .current-char { border-bottom: 2px solid #e2b714; }

/* â”€â”€ 2. Official Monkeytype Paper Theme (Clean Monochrome) â”€â”€ */
body.theme-paper { background-color: #eeeeee; color: #444444; }
body.theme-paper .c-main { color: #444444; }
body.theme-paper .c-sub { color: #b2b2b2; }
body.theme-paper .c-text { color: #444444; }
body.theme-paper .c-err { color: #d70000; }
body.theme-paper .bg-panel { background-color: #dddddd; }
body.theme-paper .bg-accent { background-color: #444444; color: #eeeeee; }
body.theme-paper #bottom-bar { border-top-color: #cccccc; }
body.theme-paper #res-bottom-grid { border-top-color: #cccccc; }
body.theme-paper .res-btn { background: #dddddd; border: 1px solid #bbb; color: #444444; }
body.theme-paper #settings-modal { background: rgba(238, 238, 238, 0.98); color: #444444; }
body.theme-paper .set-row { border-bottom-color: #d6d6d6; }
body.theme-paper .set-btn { background: #dddddd; color: #777777; }
body.theme-paper .set-btn.active { background: #444444; color: #eeeeee; }
body.theme-paper .caret-bar .current-char { border-left: 2px solid #444444; }
body.theme-paper .caret-block .current-char { background-color: rgba(68, 68, 68, 0.25); }
body.theme-paper .caret-underline .current-char { border-bottom: 2px solid #444444; }

/* â”€â”€ App Container â”€â”€ */
#app-container {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-orient: vertical;
  -webkit-box-direction: normal;
  -webkit-flex-direction: column;
  flex-direction: column;
  height: 100%;
  width: 100%;
  padding: 6px 10px 4px;
  position: relative;
}

/* View State Toggling */
#results-view { display: none; }
#app-container.state-results #stats-row { display: none; }
#app-container.state-results #words-wrapper { display: none; }
#app-container.state-results #results-view {
  display: block;
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  overflow-y: auto;
  padding: 2px 0;
}

/* â”€â”€ Top Bar â”€â”€ */
#header {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  height: 26px;
  flex-shrink: 0;
}

#logo {
  font-size: 16px;
  font-weight: bold;
  letter-spacing: 1px;
}
#logo span { font-size: 12px; font-weight: normal; }

#header-menu {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
}

.pill-btn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 12px;
  padding: 3px 6px;
  margin-left: 2px;
  cursor: pointer;
  border-radius: 3px;
  outline: none;
}
.pill-btn.active {
  font-weight: bold;
}

/* â”€â”€ Live Stats Bar â”€â”€ */
#stats-row {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: baseline;
  -webkit-align-items: baseline;
  align-items: baseline;
  height: 32px;
  margin-top: 2px;
  flex-shrink: 0;
}

#timer-val {
  font-size: 28px;
  font-weight: bold;
  line-height: 1;
}

#live-indicators {
  font-size: 13px;
  text-align: right;
}
#live-wpm-val { font-weight: bold; margin-right: 8px; }

/* â”€â”€ Words Display Area â”€â”€ */
#words-wrapper {
  -webkit-box-flex: 1;
  -webkit-flex: 1;
  flex: 1;
  position: relative;
  overflow: hidden;
  margin: 4px 0;
  cursor: text;
}

#words-inner {
  position: relative;
  -webkit-transition: margin-top 0.1s ease-out, margin-left 0.1s ease-out;
  transition: margin-top 0.1s ease-out, margin-left 0.1s ease-out;
  padding-top: 2px;
  display: inline-block;
  min-width: 100%;
}

.word {
  display: inline-block;
  margin: 0 10px 10px 0;
  font-size: 21px;
  line-height: 30px;
  vertical-align: top;
  white-space: nowrap;
}

.char {
  position: relative;
}

/* â”€â”€ TAPE MODE â”€â”€ */
#app-container.tape-active #words-wrapper {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  overflow: hidden;
  white-space: nowrap;
}

#app-container.tape-active #words-inner {
  white-space: nowrap;
  margin-top: 0 !important;
  display: inline-block;
}

#app-container.tape-active .word {
  margin: 0 16px 0 0;
  font-size: 24px;
  line-height: 34px;
}

/* Caret Blinking */
.current-char {
  margin-left: -1px;
  padding-left: 1px;
  -webkit-animation: blinkBar 0.9s infinite;
  animation: blinkBar 0.9s infinite;
}

@-webkit-keyframes blinkBar { 0%, 100% { border-color: inherit; } 50% { border-color: transparent; } }
@keyframes blinkBar { 0%, 100% { border-color: inherit; } 50% { border-color: transparent; } }

/* â”€â”€ Hidden Input â”€â”€ */
#hidden-input {
  position: absolute;
  left: -9999px;
  top: 0;
  opacity: 0;
  width: 1px;
  height: 1px;
  border: none;
  outline: none;
}

/* â”€â”€ Bottom Bar â”€â”€ */
#bottom-bar {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  height: 22px;
  flex-shrink: 0;
  border-top: 1px solid #3d3f42;
  padding-top: 2px;
}

.bot-btn {
  background: none;
  border: none;
  font-family: inherit;
  font-size: 11px;
  cursor: pointer;
  outline: none;
  padding: 1px 3px;
}
.bot-hint {
  font-size: 11px;
}

/* â”€â”€ Focus Prompt â”€â”€ */
#focus-prompt {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(30, 32, 35, 0.9);
  -webkit-box-pack: center;
  -webkit-justify-content: center;
  justify-content: center;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  font-size: 13px;
  cursor: pointer;
  z-index: 10;
}

/* â”€â”€ RESULTS SCREEN â”€â”€ */
#res-top-row {
  overflow: hidden;
  margin-bottom: 2px;
}

.res-hero-stat {
  float: left;
  margin-right: 14px;
}

.res-hero-lbl {
  font-size: 11px;
  line-height: 1;
}

.res-hero-val {
  font-size: 38px;
  font-weight: bold;
  line-height: 1;
  margin-top: 1px;
}

#res-meta-info {
  float: right;
  text-align: right;
  font-size: 10px;
  line-height: 1.3;
}

/* Chart Canvas */
#res-chart-container {
  width: 100%;
  height: 90px;
  position: relative;
  margin: 2px 0;
  clear: both;
}

#res-canvas {
  width: 100%;
  height: 90px;
  display: block;
}

/* Bottom 4 Columns Stats */
#res-bottom-grid {
  width: 100%;
  display: table;
  table-layout: fixed;
  margin: 3px 0 4px;
  border-top: 1px solid #3d3f42;
  padding-top: 3px;
  clear: both;
}

.res-sub-col {
  display: table-cell;
  text-align: center;
}

.res-sub-lbl {
  font-size: 10px;
  margin-bottom: 1px;
}

.res-sub-val {
  font-size: 13px;
  font-weight: bold;
}

/* Actions Bar */
#res-actions-bar {
  text-align: center;
  margin-bottom: 2px;
  clear: both;
}

.res-btn {
  display: inline-block;
  font-family: inherit;
  font-size: 14px;
  padding: 4px 14px;
  margin: 0 4px;
  cursor: pointer;
  border-radius: 4px;
  outline: none;
}
.res-btn:hover, .res-btn:active {
  opacity: 0.8;
}

/* Words History */
#words-history-panel {
  display: none;
  background: rgba(0,0,0,0.15);
  border-radius: 4px;
  padding: 6px;
  font-size: 12px;
  line-height: 18px;
  max-height: 70px;
  overflow-y: auto;
  margin-top: 4px;
  text-align: left;
  clear: both;
}

.hist-word {
  display: inline-block;
  margin-right: 6px;
}
.hist-word.correct { opacity: 0.9; }
.hist-word.incorrect { color: #ca4754; text-decoration: line-through; }

/* â”€â”€ Settings Modal â”€â”€ */
#settings-modal {
  display: none;
  position: absolute;
  top: 0; left: 0; right: 0; bottom: 0;
  z-index: 100;
  padding: 10px;
  overflow-y: auto;
}

#settings-top {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding-bottom: 6px;
  border-bottom: 1px solid #888;
  margin-bottom: 6px;
}

.set-row {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
  -webkit-box-pack: justify;
  -webkit-justify-content: space-between;
  justify-content: space-between;
  -webkit-box-align: center;
  -webkit-align-items: center;
  align-items: center;
  padding: 6px 0;
  border-bottom: 1px solid #333;
  font-size: 12px;
}

.set-group {
  display: -webkit-box;
  display: -webkit-flex;
  display: flex;
}

.set-btn {
  border: none;
  font-family: inherit;
  font-size: 11px;
  padding: 4px 8px;
  margin-left: 3px;
  border-radius: 3px;
  cursor: pointer;
  outline: none;
  font-weight: normal;
}
.set-btn.active {
  font-weight: bold;
}
</style>
</head>

  var resCharsNum = document.getElementById('res-chars-num');
  var resConsNum = document.getElementById('res-cons-num');
  var resTimeNum = document.getElementById('res-time-num');
  var resCanvas = document.getElementById('res-canvas');
  var wordsHistoryPanel = document.getElementById('words-history-panel');

  var btnResNext = document.getElementById('btn-res-next');
  var btnResRepeat = document.getElementById('btn-res-repeat');
  var btnResWords = document.getElementById('btn-res-words');

  var btnRestart = document.getElementById('btn-restart');
  var pbTag = document.getElementById('pb-tag');
  var settingsModal = document.getElementById('settings-modal');
  var btnSettings = document.getElementById('btn-settings');
  var btnCloseSettings = document.getElementById('btn-close-settings');
  var setPunct = document.getElementById('set-punct');
  var setNum = document.getElementById('set-num');

  /* â”€â”€ Persistence â”€â”€ */
  function loadSettings() {
    try {
      var saved = localStorage.getItem('bbtype_v2_cfg');
      if (saved) {
        var parsed = JSON.parse(saved);
        for (var k in parsed) { cfg[k] = parsed[k]; }
      }
    } catch(e) {}
    if (cfg.theme !== 'monkeytype' && cfg.theme !== 'paper') {
      cfg.theme = 'monkeytype';
    }
    applySettingsUI();
  }

  function saveSettings() {
    try {
      localStorage.setItem('bbtype_v2_cfg', JSON.stringify(cfg));
    } catch(e) {}
  }

  function applySettingsUI() {
    document.body.className = 'theme-' + cfg.theme;
    
    var containerClasses = 'caret-' + cfg.caret;
    if (cfg.tape !== 'off') containerClasses += ' tape-active';
    if (isFinished) containerClasses += ' state-results';
    container.className = containerClasses;

    var headerBtns = document.getElementById('header-menu').getElementsByTagName('button');
    for (var i = 0; i < headerBtns.length; i++) {
      var btn = headerBtns[i];
      var t = btn.getAttribute('data-type');
      var v = parseInt(btn.getAttribute('data-val'), 10);
      if (t === cfg.mode && ((t === 'time' && v === cfg.timeVal) || (t === 'words' && v === cfg.wordsVal))) {
        btn.className = 'pill-btn c-main active';
      } else if (btn.id !== 'btn-settings') {
        btn.className = 'pill-btn c-sub';
      }
    }

    syncGroupActive('grp-theme', cfg.theme);
    syncGroupActive('grp-tape', cfg.tape);
    syncGroupActive('grp-diff', cfg.diff);
    syncGroupActive('grp-conf', cfg.conf);
    syncGroupActive('grp-stop', cfg.stop);
    syncGroupActive('grp-caret', cfg.caret);

    setPunct.className = 'set-btn' + (cfg.withPunct ? ' active' : '');
    setNum.className = 'set-btn' + (cfg.withNum ? ' active' : '');

    loadPB();
  }

  function syncGroupActive(id, val) {
    var g = document.getElementById(id);
    if (!g) return;
    var btns = g.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      btns[i].className = (btns[i].getAttribute('data-val') === val) ? 'set-btn active' : 'set-btn';
    }
  }

  function getPBKey() {
    return 'bbtype_pb_' + cfg.mode + '_' + (cfg.mode === 'time' ? cfg.timeVal : cfg.wordsVal);
  }

  function loadPB() {
    try {
      var val = localStorage.getItem(getPBKey()) || '0';
      pbTag.textContent = 'PB: ' + val;
    } catch(e) { pbTag.textContent = 'PB: 0'; }
  }

  function savePB(wpm) {
    try {
      var key = getPBKey();
      var cur = parseInt(localStorage.getItem(key) || '0', 10);
      if (wpm > cur) {
        localStorage.setItem(key, wpm);
        pbTag.textContent = 'PB: ' + wpm;
      }
    } catch(e) {}
  }

  /* â”€â”€ Words Generation â”€â”€ */
  function shuffle(arr) {
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = a[i]; a[i] = a[j]; a[j] = t;
    }
    return a;
  }

  function generateWords(count) {
    var pool = shuffle(WORDS);
    var list = [];
    var puncs = ['.', ',', '!', '?', ';', '-'];

    for (var i = 0; i < count; i++) {
      var w = pool[i % pool.length];
      if (cfg.withNum && Math.random() < 0.15) {
        w = String(Math.floor(Math.random() * 900 + 10));
      } else if (cfg.withPunct) {
        var r = Math.random();
        if (r < 0.15) w = w.charAt(0).toUpperCase() + w.slice(1);
        if (r < 0.22) w = w + puncs[Math.floor(Math.random() * puncs.length)];
      }
      list.push(w);
    }
    return list;
  }

  function renderWordsDOM() {
    var html = '';
    for (var i = 0; i < activeWords.length; i++) {
      var w = activeWords[i];
      html += '<div class="word" id="w-' + i + '">';
      for (var j = 0; j < w.length; j++) {
        var cls = 'char c-sub';
        if (i === 0 && j === 0) cls += ' current-char';
        html += '<span class="' + cls + '">' + escapeHtml(w.charAt(j)) + '</span>';
      }
      html += '</div>';
    }
    wordsInner.innerHTML = html;
  }

  function escapeHtml(s) {
    return s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;');
  }

  /* â”€â”€ Robust Horizontal Tape Scrolling â”€â”€ */
  function scrollTape() {
    if (cfg.tape === 'off') return;
    var wordEl = document.getElementById('w-' + wordIndex);
    if (!wordEl) return;

    var wrapperW = wordsWrapper.offsetWidth || 320;
    var targetX = 0;

    if (cfg.tape === 'letter') {
      var charIdx = hiddenInput.value.length;
      var spans = wordEl.getElementsByTagName('span');
      if (charIdx < spans.length) {
        // Direct pixel offset from wordsInner
        targetX = spans[charIdx].offsetLeft;
      } else if (spans.length > 0) {
        var last = spans[spans.length - 1];
        targetX = last.offsetLeft + last.offsetWidth;
      } else {
        targetX = wordEl.offsetLeft;
      }
    } else {
      // 'word' mode: center the current word
      targetX = wordEl.offsetLeft;
    }

    var targetCenter = wrapperW / 2;
    var offset = targetX - targetCenter;
    if (offset < 0) offset = 0;
    wordsInner.style.marginLeft = '-' + Math.round(offset) + 'px';
  }

  /* â”€â”€ Input Processing â”€â”€ */
  function updateWordDisplay() {
    var wordEl = document.getElementById('w-' + wordIndex);
    if (!wordEl) return;

    var val = hiddenInput.value;
    var targetWord = activeWords[wordIndex];
    var spans = wordEl.children;

    for (var i = 0; i < targetWord.length; i++) {
      var span = spans[i];
      if (!span) continue;

      if (i < val.length) {
        var isMatch = (val.charAt(i) === targetWord.charAt(i));
        span.className = 'char ' + (isMatch ? 'c-text' : 'c-err');
        if (!isMatch) errorsThisSecond++;
      } else if (i === val.length) {
        span.className = 'char c-sub current-char';
      } else {
        span.className = 'char c-sub';
      }
    }

    var existingExtras = wordEl.getElementsByClassName('extra-char');
    while (existingExtras.length > 0) {
      existingExtras[0].parentNode.removeChild(existingExtras[0]);
    }

    if (val.length > targetWord.length) {
      for (var k = targetWord.length; k < val.length; k++) {
        var extra = document.createElement('span');
        extra.className = 'char c-err extra-char';
        if (k === val.length - 1) extra.className += ' current-char';
        extra.textContent = val.charAt(k);
        wordEl.appendChild(extra);
        errorsThisSecond++;
      }
    }

    if (cfg.diff === 'master') {
      for (var m = 0; m < val.length; m++) {
        if (m < targetWord.length && val.charAt(m) !== targetWord.charAt(m)) {
          failTest('Master: 100% Accuracy Required');
          return;
        }
      }
    }

    if (cfg.stop === 'letter' && val.length > 0) {
      var lastIdx = val.length - 1;
      if (lastIdx < targetWord.length && val.charAt(lastIdx) !== targetWord.charAt(lastIdx)) {
        hiddenInput.value = val.substring(0, lastIdx);
        updateWordDisplay();
        return;
      }
    }

    if (cfg.tape === 'letter') {
      scrollTape();
    }
  }

  function handleSpace() {
    var val = hiddenInput.value;
    if (val.length === 0) return;

    var targetWord = activeWords[wordIndex];
    var isExact = (val === targetWord);

    if (cfg.stop === 'word' && !isExact) return;

    if (cfg.diff === 'expert' && !isExact) {
      failTest('Expert: Word Misspelled');
      return;
    }

    var maxLen = Math.max(val.length, targetWord.length);
    for (var i = 0; i < maxLen; i++) {
      if (i < val.length && i < targetWord.length) {
        if (val.charAt(i) === targetWord.charAt(i)) correctChars++;
        else incorrectChars++;
      } else if (i >= targetWord.length) {
        extraChars++;
        incorrectChars++;
      } else {
        missedChars++;
      }
      rawChars++;
    }
    if (isExact) correctChars++;
    else incorrectChars++;
    rawChars++;

    var oldWord = document.getElementById('w-' + wordIndex);
    if (oldWord) {
      var cur = oldWord.getElementsByClassName('current-char');
      if (cur.length > 0) cur[0].className = cur[0].className.replace(' current-char', '');
    }

    wordHistory.push(val);
    wordIndex++;
    hiddenInput.value = '';

    if (cfg.mode === 'words') {
      wordsLeft--;
      timerVal.textContent = wordsLeft;
      if (wordsLeft <= 0) {
        finishTest();
        return;
      }
    }

    var nextWord = document.getElementById('w-' + wordIndex);
    if (nextWord && nextWord.children.length > 0) {
      nextWord.children[0].className += ' current-char';
      
      if (cfg.tape !== 'off') {
        scrollTape();
      } else {
        var wordTop = nextWord.offsetTop;
        var curMargin = Math.abs(parseInt(wordsInner.style.marginTop, 10) || 0);
        var wrapperH = wordsWrapper.clientHeight;

        if (wordTop > curMargin + wrapperH - 40) {
          wordsInner.style.marginTop = '-' + (wordTop - 6) + 'px';
        }
      }
    }

    if (wordIndex >= activeWords.length - 15) {
      appendWords(40);
    }
  }

  function handleBackspace() {
    if (cfg.conf === 'max') return;

    if (hiddenInput.value.length === 0 && wordIndex > 0 && cfg.conf === 'off') {
      var curWord = document.getElementById('w-' + wordIndex);
      if (curWord) {
        var c = curWord.getElementsByClassName('current-char');
        if (c.length > 0) c[0].className = c[0].className.replace(' current-char', '');
      }

      wordIndex--;
      var restored = wordHistory.pop() || '';
      hiddenInput.value = restored;

      var targetWord = activeWords[wordIndex];
      var maxLen = Math.max(restored.length, targetWord.length);
      for (var i = 0; i < maxLen; i++) {
        if (i < restored.length && i < targetWord.length) {
          if (restored.charAt(i) === targetWord.charAt(i)) correctChars = Math.max(0, correctChars - 1);
          else incorrectChars = Math.max(0, incorrectChars - 1);
        } else if (i >= targetWord.length) {
          extraChars = Math.max(0, extraChars - 1);
          incorrectChars = Math.max(0, incorrectChars - 1);
        } else {
          missedChars = Math.max(0, missedChars - 1);
        }
        rawChars = Math.max(0, rawChars - 1);
      }
      if (restored === targetWord) correctChars = Math.max(0, correctChars - 1);
      else incorrectChars = Math.max(0, incorrectChars - 1);
      rawChars = Math.max(0, rawChars - 1);

      updateWordDisplay();
      if (cfg.tape !== 'off') scrollTape();
    }
  }

  function appendWords(count) {
    var more = generateWords(count);
    var start = activeWords.length;
    for (var i = 0; i < more.length; i++) {
      activeWords.push(more[i]);
      var div = document.createElement('div');
      div.className = 'word';
      div.id = 'w-' + (start + i);
      for (var j = 0; j < more[i].length; j++) {
        div.innerHTML += '<span class="char c-sub">' + escapeHtml(more[i].charAt(j)) + '</span>';
      }
      wordsInner.appendChild(div);
    }
  }

  /* â”€â”€ Test Lifecycle â”€â”€ */
  function startTest() {
    isRunning = true;
    startTime = Date.now();
    chartData = [];
    errorsThisSecond = 0;

    var secCounter = 0;
    timerId = setInterval(function() {
      secCounter++;
      if (cfg.mode === 'time') {
        timeLeft--;
        timerVal.textContent = timeLeft;
        if (timeLeft <= 0) {
          finishTest();
          return;
        }
      }

      var elapsed = (Date.now() - startTime) / 1000;
      var curWpm = Math.round((correctChars / 5) / (elapsed / 60)) || 0;
      var curRaw = Math.round((rawChars / 5) / (elapsed / 60)) || 0;

      chartData.push({
        second: secCounter,
        wpm: curWpm,
        raw: curRaw,
        errors: errorsThisSecond
      });
      errorsThisSecond = 0;

      updateLiveStats();
    }, 1000);
  }

  function updateLiveStats() {
    var elapsed = (Date.now() - startTime) / 1000;
    if (elapsed < 0.3) return;

    var curCorrect = correctChars;
    var curIncorrect = incorrectChars;
    var val = hiddenInput.value;
    var target = activeWords[wordIndex] || '';

    for (var i = 0; i < val.length; i++) {
      if (i < target.length && val.charAt(i) === target.charAt(i)) curCorrect++;
      else curIncorrect++;
    }

    var wpm = Math.round((curCorrect / 5) / (elapsed / 60));
    if (isNaN(wpm) || wpm < 0) wpm = 0;

    var total = curCorrect + curIncorrect;
    var acc = total > 0 ? Math.round((curCorrect / total) * 100) : 100;

    liveWpmVal.textContent = wpm + ' wpm';
    liveAccVal.textContent = acc + '%';
  }

  function failTest(reason) {
    clearInterval(timerId);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    resWpmNum.textContent = '0';
    resWpmNum.className = 'res-hero-val c-err';
    resAccNum.textContent = 'FAIL';
    resRawNum.textContent = '0';
    resCharsNum.textContent = reason;
    resConsNum.textContent = '0%';
    resTimeNum.textContent = '0s';

    var containerClasses = 'caret-' + cfg.caret + ' state-results';
    if (cfg.tape !== 'off') containerClasses += ' tape-active';
    container.className = containerClasses;
    wordsHistoryPanel.style.display = 'none';
  }

  function finishTest() {
    if (isFinished) return;
    clearInterval(timerId);
    isRunning = false;
    isFinished = true;
    hiddenInput.disabled = true;

    var elapsed = (Date.now() - startTime) / 1000;
    if (cfg.mode === 'time') elapsed = cfg.timeVal;
    if (elapsed <= 0) elapsed = 1;

    var val = hiddenInput.value;
    var target = activeWords[wordIndex] || '';
    for (var i = 0; i < val.length; i++) {
      if (i < target.length && val.charAt(i) === target.charAt(i)) correctChars++;
      else incorrectChars++;
      rawChars++;
    }

    var netWpm = Math.round((correctChars / 5) / (elapsed / 60)) || 0;
    var rawWpm = Math.round((rawChars / 5) / (elapsed / 60)) || 0;
    var total = correctChars + incorrectChars;
    var acc = total > 0 ? Math.round((correctChars / total) * 100) : 0;

    if (netWpm < 0) netWpm = 0;
    if (rawWpm < 0) rawWpm = 0;

    var wpmSamples = [];
    for (var s = 0; s < chartData.length; s++) {
      wpmSamples.push(chartData[s].wpm);
    }
    var consistency = calculateConsistency(wpmSamples);

    resWpmNum.textContent = netWpm;
    resWpmNum.className = 'res-hero-val c-main';
    resAccNum.textContent = acc + '%';
    resTestType.textContent = cfg.mode + ' ' + (cfg.mode === 'time' ? cfg.timeVal : cfg.wordsVal);
    resRawNum.textContent = rawWpm;
    resCharsNum.textContent = correctChars + '/' + incorrectChars + '/' + extraChars + '/' + missedChars;
    resConsNum.textContent = consistency + '%';
    resTimeNum.textContent = Math.round(elapsed) + 's';

    savePB(netWpm);

    var containerClasses = 'caret-' + cfg.caret + ' state-results';
    if (cfg.tape !== 'off') containerClasses += ' tape-active';
    container.className = containerClasses;
    wordsHistoryPanel.style.display = 'none';

    setTimeout(function() {
      drawResultChart(netWpm, rawWpm);
    }, 40);
  }

  function calculateConsistency(samples) {
    if (!samples || samples.length < 2) return 100;
    var sum = 0;
    for (var i = 0; i < samples.length; i++) sum += samples[i];
    var mean = sum / samples.length;
    if (mean <= 0) return 100;

    var varSum = 0;
    for (var j = 0; j < samples.length; j++) {
      var d = samples[j] - mean;
      varSum += d * d;
    }
    var stdDev = Math.sqrt(varSum / samples.length);
    var cv = (stdDev / mean) * 100;
    return Math.max(0, Math.min(100, Math.round(100 - cv)));
  }

  function drawResultChart(finalWpm, finalRaw) {
    if (!resCanvas) return;
    var width = resCanvas.offsetWidth || 300;
    var height = resCanvas.offsetHeight || 88;
    var dpr = window.devicePixelRatio || 1;

    resCanvas.width = width * dpr;
    resCanvas.height = height * dpr;

    var ctx = resCanvas.getContext('2d');
    if (!ctx) return;

    ctx.scale(dpr, dpr);
    ctx.clearRect(0, 0, width, height);

    var data = chartData.slice();
    if (data.length === 0) {
      data.push({ second: 1, wpm: finalWpm || 0, raw: finalRaw || 0, errors: 0 });
      data.push({ second: 2, wpm: finalWpm || 0, raw: finalRaw || 0, errors: 0 });
    } else if (data.length === 1) {
      data.push({ second: 2, wpm: data[0].wpm, raw: data[0].raw, errors: 0 });
    }

    var padL = 22;
    var padR = 12;
    var padT = 10;
    var padB = 14;
    var plotW = width - padL - padR;
    var plotH = height - padT - padB;

    var maxW = 40;
    for (var i = 0; i < data.length; i++) {
      if (data[i].raw > maxW) maxW = data[i].raw;
      if (data[i].wpm > maxW) maxW = data[i].wpm;
    }
    maxW = Math.ceil(maxW / 20) * 20 + 20;

    var isPaper = (cfg.theme === 'paper');
    var labelColor = isPaper ? '#888888' : '#646669';
    var gridColor = isPaper ? '#d0d0d0' : '#3d3f42';
    var themeColor = isPaper ? '#444444' : '#e2b714';

    // Grid
    ctx.font = '8px monospace';
    ctx.fillStyle = labelColor;
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.strokeStyle = gridColor;
    ctx.lineWidth = 1;

    var steps = 2;
    for (var s = 0; s <= steps; s++) {
      var val = Math.round((maxW / steps) * s);
      var y = padT + plotH - (s / steps) * plotH;
      ctx.beginPath();
      ctx.moveTo(padL, y);
      ctx.lineTo(width - padR, y);
      ctx.stroke();
      if (s > 0) ctx.fillText(val, padL - 3, y);
    }

    var totalPoints = data.length;
    function getX(idx) { return padL + (idx / (totalPoints - 1)) * plotW; }
    function getY(w) { return padT + plotH - (w / maxW) * plotH; }

    // 1. Raw line
    ctx.beginPath();
    ctx.strokeStyle = labelColor;
    ctx.lineWidth = 1.5;
    if (ctx.setLineDash) ctx.setLineDash([2, 2]);
    for (var r = 0; r < data.length; r++) {
      var rx = getX(r);
      var ry = getY(data[r].raw);
      if (r === 0) ctx.moveTo(rx, ry);
      else ctx.lineTo(rx, ry);
    }
    ctx.stroke();
    if (ctx.setLineDash) ctx.setLineDash([]);

    // 2. Net WPM line
    ctx.beginPath();
    for (var w = 0; w < data.length; w++) {
      var wx = getX(w);
      var wy = getY(data[w].wpm);
      if (w === 0) ctx.moveTo(wx, wy);
      else ctx.lineTo(wx, wy);
    }
    ctx.strokeStyle = themeColor;
    ctx.lineWidth = 2.2;
    ctx.stroke();

    // 3. Error crosses
    ctx.fillStyle = '#ca4754';
    ctx.font = 'bold 9px monospace';
    ctx.textAlign = 'center';
    for (var e = 0; e < data.length; e++) {
      if (data[e].errors > 0) {
        ctx.fillText('Ã—', getX(e), padT + 2);
      }
    }

    // 4. X-Axis Ticks
    ctx.fillStyle = labelColor;
    ctx.font = '8px monospace';
    ctx.textAlign = 'center';
    ctx.textBaseline = 'top';
    var xStep = Math.max(1, Math.floor(data.length / 4));
    for (var t = 0; t < data.length; t += xStep) {
      ctx.fillText(data[t].second, getX(t), padT + plotH + 2);
    }
    if (data.length > 1 && (data.length - 1) % xStep !== 0) {
      ctx.fillText(data[data.length - 1].second, getX(data.length - 1), padT + plotH + 2);
    }
  }

  function renderWordsHistory() {
    var html = '';
    for (var i = 0; i < wordHistory.length; i++) {
      var typed = wordHistory[i];
      var target = activeWords[i] || '';
      var isOk = (typed === target);
      html += '<span class="hist-word ' + (isOk ? 'correct' : 'incorrect') + '">' + escapeHtml(typed) + '</span>';
    }
    wordsHistoryPanel.innerHTML = html || 'No words typed';
  }

  function resetTest(repeatSameWords) {
    clearInterval(timerId);
    isRunning = false;
    isFinished = false;
    wordIndex = 0;
    wordHistory = [];
    chartData = [];
    errorsThisSecond = 0;

    correctChars = 0;
    incorrectChars = 0;
    extraChars = 0;
    missedChars = 0;
    rawChars = 0;

    if (cfg.mode === 'time') {
      timeLeft = cfg.timeVal;
      timerVal.textContent = cfg.timeVal;
    } else {
      wordsLeft = cfg.wordsVal;
      timerVal.textContent = cfg.wordsVal;
    }

    liveWpmVal.textContent = '0 wpm';
    liveAccVal.textContent = '100%';
    hiddenInput.value = '';
    hiddenInput.disabled = false;
    wordsInner.style.marginTop = '0px';
    wordsInner.style.marginLeft = '0px';

    var containerClasses = 'caret-' + cfg.caret;
    if (cfg.tape !== 'off') containerClasses += ' tape-active';
    container.className = containerClasses;

    focusPrompt.style.display = 'none';
    wordsHistoryPanel.style.display = 'none';

    if (!repeatSameWords) {
      var initCount = (cfg.mode === 'words') ? Math.max(cfg.wordsVal, 30) : 80;
      activeWords = generateWords(initCount);
    }
    renderWordsDOM();

    setTimeout(function() { hiddenInput.focus(); }, 30);
  }

  /* â”€â”€ Event Handlers â”€â”€ */
  hiddenInput.addEventListener('input', function() {
    if (isFinished) return;
    if (!isRunning && hiddenInput.value.length > 0) startTest();
    updateWordDisplay();
  });

  hiddenInput.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;

    if (code === 9) {
      e.preventDefault();
      resetTest(false);
      return;
    }

    if (code === 27) {
      e.preventDefault();
      if (settingsModal.style.display === 'block') {
        settingsModal.style.display = 'none';
        hiddenInput.focus();
      } else {
        resetTest(false);
      }
      return;
    }

    if (isFinished) {
      if (code === 13 || code === 32) {
        e.preventDefault();
        resetTest(false);
      }
      return;
    }

    if (code === 32) {
      e.preventDefault();
      handleSpace();
      return;
    }

    if (code === 8) {
      if (hiddenInput.value.length === 0) {
        e.preventDefault();
        handleBackspace();
      }
      return;
    }

    if (code === 13) {
      e.preventDefault();
      resetTest(false);
      return;
    }
  });

  window.addEventListener('keydown', function(e) {
    var code = e.keyCode || e.which;
    if (code === 9) {
      e.preventDefault();
      resetTest(false);
      return;
    }
    if (document.activeElement !== hiddenInput && !isFinished && settingsModal.style.display !== 'block') {
      hiddenInput.focus();
    }
  });

  hiddenInput.addEventListener('focus', function() { focusPrompt.style.display = 'none'; });
  hiddenInput.addEventListener('blur', function() {
    if (!isFinished && settingsModal.style.display !== 'block') {
      focusPrompt.style.display = '-webkit-flex';
      focusPrompt.style.display = 'flex';
    }
  });
  wordsWrapper.addEventListener('click', function() { hiddenInput.focus(); });
  focusPrompt.addEventListener('click', function() { hiddenInput.focus(); });

  var headerBtns = document.getElementById('header-menu').getElementsByTagName('button');
  for (var h = 0; h < headerBtns.length; h++) {
    (function(btn) {
      btn.addEventListener('click', function(e) {
        e.stopPropagation();
        var t = btn.getAttribute('data-type');
        if (!t) return;
        cfg.mode = t;
        if (t === 'time') cfg.timeVal = parseInt(btn.getAttribute('data-val'), 10);
        else cfg.wordsVal = parseInt(btn.getAttribute('data-val'), 10);
        saveSettings();
        applySettingsUI();
        resetTest(false);
      });
    })(headerBtns[h]);
  }

  btnResNext.addEventListener('click', function() { resetTest(false); });
  btnResRepeat.addEventListener('click', function() { resetTest(true); });
  btnResWords.addEventListener('click', function() {
    if (wordsHistoryPanel.style.display === 'block') {
      wordsHistoryPanel.style.display = 'none';
    } else {
      renderWordsHistory();
      wordsHistoryPanel.style.display = 'block';
    }
  });

  btnRestart.addEventListener('click', function() { resetTest(false); });

  btnSettings.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    settingsModal.style.display = 'block';
  });

  btnCloseSettings.addEventListener('click', function(e) {
    e.preventDefault();
    e.stopPropagation();
    settingsModal.style.display = 'none';
    setTimeout(function() { hiddenInput.focus(); }, 20);
  });

  function bindSettingGroup(id, prop) {
    var g = document.getElementById(id);
    if (!g) return;
    var btns = g.getElementsByTagName('button');
    for (var i = 0; i < btns.length; i++) {
      (function(btn) {
        btn.addEventListener('click', function(e) {
          e.stopPropagation();
          cfg[prop] = btn.getAttribute('data-val');
          saveSettings();
          applySettingsUI();
          resetTest(false);
        });
      })(btns[i]);
    }
  }

  bindSettingGroup('grp-theme', 'theme');
  bindSettingGroup('grp-tape', 'tape');
  bindSettingGroup('grp-diff', 'diff');
  bindSettingGroup('grp-conf', 'conf');
  bindSettingGroup('grp-stop', 'stop');
  bindSettingGroup('grp-caret', 'caret');

  setPunct.addEventListener('click', function(e) {
    e.stopPropagation();
    cfg.withPunct = !cfg.withPunct;
    saveSettings();
    applySettingsUI();
    resetTest(false);
  });

  setNum.addEventListener('click', function(e) {
    e.stopPropagation();
    cfg.withNum = !cfg.withNum;
    saveSettings();
    applySettingsUI();
    resetTest(false);
  });

  /* â”€â”€ Init â”€â”€ */
  loadSettings();
  resetTest(false);
})();
</script>
</body>
</html>
